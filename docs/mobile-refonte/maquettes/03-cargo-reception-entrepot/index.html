<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../kit.css">
<style>
/* —— lot 03 : cargo, réception, entrepôt —— */
.mk.sea { background: #efe8ff } .mk.air { background: #e4f0ff } .mk.tk { background: var(--orange-soft) } .mk.ok { background: var(--green-soft) } .mk.am { background: var(--amber-soft) } .mk.gr { background: #f2f0f6 }
.meth4 .mk.mtn { font-size: 10px }
.mk.xaf { background: #2f8f5b; font: 800 11.5px "DM Sans" } .mk.wal { background: var(--violet); font: 800 12px "DM Sans" }
.acts { display: flex; gap: 10px }
/* photo de colis */
.ph { position: relative; display: block; flex: none; overflow: hidden; background: linear-gradient(170deg, #c9c3b8 0%, #a59d90 100%) }
.ph .bx { position: absolute; left: 13%; right: 11%; top: 17%; bottom: 11%; border-radius: 3px; background: var(--b); transform: rotate(var(--r)); box-shadow: 0 3px 6px rgba(0,0,0,.25) }
.ph .bx::before { content: ""; position: absolute; left: 42%; width: 15%; top: 0; bottom: 0; background: var(--t) }
.ph .bx::after { content: ""; position: absolute; right: 9%; bottom: 12%; width: 30%; height: 22%; background: #fbfaf6; border-radius: 1.5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06) }
.ph.nol .bx::after { display: none }
/* en-tête dossier conteneur */
.dh { margin: 0 16px 12px; background: #fff; border-radius: 20px; padding: 14px 16px 14px; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
.dh .t1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.dh h2 { font: 800 21px/1.15 "DM Sans"; letter-spacing: -.02em }
.dh .s { font: 500 14px "DM Sans"; color: var(--t2); margin-top: 3px; display: flex; align-items: center; gap: 6px }
.route { display: flex; align-items: center; gap: 12px; margin: 16px 0 14px }
.route > span { font: 700 14px "DM Sans" } .route small { display: block; font: 500 12px "DM Sans"; color: var(--t3); margin-top: 1px }
.route .bar { flex: 1; height: 4px; background: #ebe8f0; border-radius: 2px; position: relative }
.route .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--violet); border-radius: 2px }
.route .bar em { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 14px; background: var(--violet); display: grid; place-items: center; box-shadow: 0 0 0 4px #fff }
.flags { display: flex; gap: 6px }
.flag { font: 700 12.5px "DM Sans"; padding: 6px 9px; border-radius: 9px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.flag i { width: 6px; height: 6px; border-radius: 3px }
.flag.w { background: var(--amber-soft); color: #9a5d00 } .flag.w i { background: var(--amber) }
.flag.g { background: var(--green-soft); color: #137042 } .flag.g i { background: var(--green) }
.flag.o { background: var(--orange-soft); color: #c23f07 } .flag.o i { background: var(--orange) }
.flag.r { background: #fdecec; color: #c2261d } .flag.r i { background: #d93a2f }
/* onglets internes défilants */
.dt { margin: 0 16px 6px; background: #e6e3ec; border-radius: 12px; padding: 3px; overflow: hidden; position: relative }
.dt::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 34px; background: linear-gradient(to right, rgba(230,227,236,0), #e6e3ec 80%) }
.dti { display: flex; gap: 2px; white-space: nowrap }
.dt span { height: 34px; padding: 0 13px; border-radius: 9px; display: flex; align-items: center; font: 600 14.5px "DM Sans"; color: #4b4560; flex: none }
.dt .on { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(23,17,31,.08) }
.lbl a { float: right; color: var(--violet); text-transform: none; letter-spacing: 0; font: 600 14.5px "DM Sans" }
/* escales */
.esc { padding: 6px 16px 6px }
.ei { display: flex; gap: 12px; align-items: flex-start; position: relative; padding: 9px 0 }
.ei > i { width: 13px; height: 13px; border-radius: 7px; border: 2.5px solid #cfcad9; background: #fff; margin-top: 4px; flex: none; position: relative; z-index: 1 }
.ei.done > i { background: var(--green); border-color: var(--green) }
.ei.now > i { border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft) }
.ei::before { content: ""; position: absolute; left: 5.5px; top: 26px; bottom: -10px; width: 2px; background: #ebe8f0 }
.ei:last-child::before { display: none }
.ei.done::before { background: var(--green) }
.ei b { font: 600 15.5px "DM Sans"; display: block } .ei span { font: 500 13.5px "DM Sans"; color: var(--t2) }
.ei em { margin-left: auto; font: 600 14px "DM Sans"; font-style: normal; color: var(--ink); text-align: right; white-space: nowrap }
.ei em small { display: block; font: 500 12.5px "DM Sans"; color: var(--t3) }
/* listes de feuille */
.sl { display: flex; align-items: center; gap: 14px; padding: 10px 22px; font: 600 16px "DM Sans" }
.sl .ii { width: 38px; height: 38px; border-radius: 12px; background: #f2f0f6; display: grid; place-items: center; flex: none }
.sl .tx { flex: 1; min-width: 0 } .sl .tx small { display: block; font: 500 13.5px "DM Sans"; color: var(--t2); margin-top: 1px }
.sl.red { color: #c2261d } .sl.red .ii { background: #fdecec }
.toggle.off { background: #e3e0ea } .toggle.off::after { right: auto; left: 2px }
.tog { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; position: relative; font: 600 16px "DM Sans" }
.tog small { display: block; font: 500 13.5px "DM Sans"; color: var(--t2) }
.tog + .tog::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep) }
/* jauges */
.gauge { height: 8px; border-radius: 4px; background: #ebe8f0; overflow: hidden; display: flex }
.gauge i { display: block; height: 100% }
.gl { display: flex; justify-content: space-between; font: 600 14px "DM Sans"; margin: 0 0 7px } .gl span { color: var(--t2); font-weight: 500 }
/* mini-tuiles chiffres */
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px }
.mini div { background: #fff; border-radius: 16px; padding: 11px 10px; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
.mini b { display: block; font: 800 19px "DM Sans"; letter-spacing: -.02em; font-variant-numeric: tabular-nums }

.mini span { white-space: nowrap; font: 500 12px "DM Sans"; color: var(--t2) }
.fbar { display: flex; gap: 8px; padding: 0 20px 14px; align-items: center }
.dd { height: 32px; padding: 0 10px 0 12px; border-radius: 10px; background: #fff; display: flex; align-items: center; gap: 4px; font: 600 13.5px "DM Sans"; color: var(--ink); box-shadow: 0 1px 2px rgba(23,17,31,.05); white-space: nowrap }
.dd svg { opacity: .55 }
.chips.wrap { flex-wrap: wrap; padding: 0 16px 6px }
.chips.wrap .chip { background: #f2f0f6; box-shadow: none; height: 34px }
.chips.wrap .chip.on { background: var(--ink) }
.sk { font: 700 13px "DM Sans"; color: var(--t2); text-transform: uppercase; letter-spacing: .06em; padding: 4px 22px 10px }
.tick { width: 24px; height: 24px; border-radius: 12px; border: 2px solid #cfcad9; flex: none; display: grid; place-items: center }
.tick.on { background: var(--violet); border-color: var(--violet) }
.tick.g { background: var(--green); border-color: var(--green) }
.tick.sq { border-radius: 7px }
.tick.sq.on { background: var(--ink); border-color: var(--ink) }
/* caméra */
.camv { position: absolute; inset: 0; background: radial-gradient(110% 70% at 50% 38%, #6b6157 0%, #3a332d 55%, #171412 100%) }
.frame { position: absolute; width: 236px; height: 236px; left: 50%; transform: translateX(-50%) }
.frame i { position: absolute; width: 42px; height: 42px; border: 4px solid #fff }
.frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0 }
.frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0 }
.frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 18px }
.frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 18px 0 }
.camtop { position: absolute; top: 54px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 6px 20px; color: #fff; z-index: 2; font: 600 17px "DM Sans" }
.glass { width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,.18); display: grid; place-items: center; backdrop-filter: blur(10px) }
.sbar.w { color: #fff } .sbar.w svg rect, .sbar.w svg path { fill: #fff; stroke: #fff }
.panel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; z-index: 3; padding: 10px 0 34px }
.fd { position: absolute; left: 16px; right: 16px; z-index: 4; display: flex; gap: 10px }
.field { background: #fff; border-radius: 14px; padding: 10px 14px; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
.field .k2 { font: 600 12.5px "DM Sans"; color: var(--t2) } .field .v2 { font: 600 16px "DM Sans"; margin-top: 2px }
.ring { width: 112px; height: 112px; flex: none; position: relative }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; font: 800 25px "DM Sans"; letter-spacing: -.03em; text-align: center }
.ring b small { display: block; font: 600 12.5px "DM Sans"; color: var(--t2); letter-spacing: 0 }
.sig { margin: 0 16px; height: 150px; border-radius: 18px; background: #f7f5fb; border: 1.5px dashed #d9d3e6; position: relative }
.redlink { color: #c2261d; font: 600 15.5px "DM Sans"; text-align: center; padding: 6px 0 }
.rowsel { background: #f7f3ff }
