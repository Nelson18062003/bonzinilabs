<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../kit.css">
<style>
/* --- lot 05 : styles propres --- */
.scroll.col { display: flex; flex-direction: column }
.thread.bot { flex: 1; min-height: 0; justify-content: flex-end; overflow: hidden; padding-bottom: 96px }
.msg.out .rcpt { color: var(--ink) }
.thread.bot > * { flex-shrink: 0 }
.thread.bot { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px); mask-image: linear-gradient(to bottom, transparent 0, #000 36px) }
.ttl { padding: 0 20px 14px; display: flex; align-items: flex-end; justify-content: space-between }
.ttl h1 { font: 800 34px/1.05 "DM Sans"; letter-spacing: -.03em }
.seg3 { grid-template-columns: 1fr 1fr 1fr !important }
.seg small { font: 700 12.5px "DM Sans"; color: var(--t3); margin-left: 5px }
.seg div { display: flex !important; align-items: center; justify-content: center }
.chips.sc { overflow: hidden }
.chip .cv-ic { display: grid; place-items: center }
.chip.sel { background: var(--violet-soft); color: #5a24c4; box-shadow: none }
.ub { min-width: 22px; height: 22px; border-radius: 11px; background: var(--orange); color: #fff; font: 700 12.5px/22px "DM Sans"; text-align: center; padding: 0 6px; flex: none }
/* conversations */
.cv { display: flex; gap: 12px; padding: 13px 16px; position: relative; align-items: flex-start }
.cv + .cv::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: .5px; background: var(--sep) }
.cv .av { width: 42px; height: 42px; border-radius: 21px }
.cvt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.cvt .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tm { font: 500 13px "DM Sans"; color: var(--t3); flex: none }
.cv.un .rn { font-weight: 700 }
.cv.un .tm { color: var(--orange); font-weight: 700 }
.cv.un .rs { color: var(--ink) }
.cvm { display: flex; align-items: center; gap: 6px; margin-top: 7px; font: 600 12.5px "DM Sans"; color: var(--t2) }
.tag { padding: 3px 8px; border-radius: 7px; background: #f2f0f6; font: 600 12px "DM Sans"; color: #4b4560 }
.mini { width: 20px; height: 20px; border-radius: 10px; font: 700 9.5px "DM Sans"; display: grid; place-items: center; flex: none }
.free { color: #c23f07 }
/* fil de discussion */
.thread { padding: 2px 12px 0; display: flex; flex-direction: column; gap: 5px }
.msg { max-width: 80%; padding: 9px 13px 7px; border-radius: 20px; font: 500 15.5px/1.35 "DM Sans" }
.msg.in { background: #fff; align-self: flex-start; border-bottom-left-radius: 6px; box-shadow: 0 1px 1px rgba(23,17,31,.05) }
.msg.out { background: var(--violet); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px }
.msg .meta { font: 500 11.5px "DM Sans"; opacity: .62; text-align: right; margin-top: 2px }
.dsep { text-align: center; font: 600 12.5px "DM Sans"; color: var(--t3); margin: 6px 0 4px }
.quote { border-left: 3px solid rgba(255,255,255,.65); padding: 1px 8px; margin: 2px 0 6px; font-size: 13.5px; opacity: .9 }
.quote b { display: block; font-size: 12.5px }
.who { font: 700 12px "DM Sans"; color: var(--t2); margin: 4px 0 0 6px }
.who.r { text-align: right; margin: 4px 6px 0 0 }
.voice { display: flex; align-items: center; gap: 10px; padding: 3px 0 }
.voice .pl { width: 30px; height: 30px; border-radius: 15px; background: var(--violet-soft); display: grid; place-items: center; flex: none }
.wave { display: flex; gap: 2.5px; align-items: center; height: 26px }
.wave i { width: 3px; border-radius: 2px; background: #b9a6ee }
.wave i.p { background: var(--violet) }
.typing { align-self: flex-start; background: #fff; border-radius: 18px; padding: 11px 14px; display: flex; gap: 4px }
.typing i { width: 7px; height: 7px; border-radius: 4px; background: #c4c0cf }
.composer { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 10px 34px; background: rgba(255,255,255,.97); border-top: .5px solid #dcd8e3; display: flex; align-items: center; gap: 8px; z-index: 4 }
.cbtn { width: 38px; height: 38px; border-radius: 19px; background: #f0edf5; display: grid; place-items: center; flex: none }
.cbtn.v { background: var(--violet) }
.cfield { flex: 1; height: 40px; border-radius: 20px; background: #f6f4f9; border: 1px solid #e6e2ec; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 14px; font: 500 16px "DM Sans"; color: var(--t3) }
.ctx { margin: 0 16px 8px; background: #fff; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
/* feuilles */
.srow { display: flex; align-items: center; gap: 14px; padding: 14px 22px; font: 600 16.5px "DM Sans"; position: relative }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: .5px; background: var(--sep) }
.srow .si { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none }
.srow .val { margin-left: auto; font: 500 15px "DM Sans"; color: var(--t2); display: flex; align-items: center; gap: 4px }
.cr { padding: 12px 22px; position: relative }
.cr + .cr::before { content: ""; position: absolute; top: 0; left: 22px; right: 0; height: .5px; background: var(--sep) }
.cr b { font: 700 15.5px "DM Sans"; display: flex; justify-content: space-between; align-items: center }
.cr p { font: 500 14px/1.35 "DM Sans"; color: var(--t2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.var { background: var(--violet-soft); color: #5a24c4; border-radius: 5px; padding: 0 4px; font-weight: 600 }
.picker { display: flex; gap: 14px; padding: 4px 22px 14px }
.pk { display: grid; justify-items: center; gap: 6px; font: 600 12.5px "DM Sans"; color: #4b4560; width: 56px }
.pk .av { width: 50px; height: 50px; border-radius: 25px; font-size: 16px; position: relative }
.pk.on .av { box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px var(--violet) }
.pk .ok { position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 10px; background: var(--violet); display: grid; place-items: center; box-shadow: 0 0 0 2px #fff }
.btn.red { background: var(--red); color: #fff }
.danger { margin: 0 16px 14px; background: #fdecec; color: #b0261d; border-radius: 14px; padding: 11px 14px; display: flex; gap: 10px; align-items: center; font: 700 14.5px "DM Sans" }
/* stats */
.bar-l { display: flex; align-items: center; gap: 10px; padding: 7px 16px; font: 600 14px "DM Sans" }
.bar-l .lb { width: 76px; color: var(--t2); font-weight: 500; flex: none }
.bar-l .tr { flex: 1; height: 10px; border-radius: 5px; background: #f0edf5; overflow: hidden }
.bar-l .tr i { display: block; height: 100%; background: var(--violet); border-radius: 5px }
.bar-l b { width: 40px; text-align: right; font-variant-numeric: tabular-nums }
.legend { display: flex; gap: 16px; font: 600 13px "DM Sans"; color: var(--t2); padding: 0 16px 4px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.stat.sm b { font-size: 24px }
.stat small { font: 600 12.5px "DM Sans"; color: var(--green) }
/* douane */
.pt { width: 44px; height: 44px; border-radius: 12px; flex: none; overflow: hidden; background: linear-gradient(160deg, #eef0f5, #dfe3ec); display: grid; place-items: center }
.code { font: 700 14px "DM Sans"; letter-spacing: .01em; font-variant-numeric: tabular-nums }
.photos { display: flex; gap: 8px; padding: 0 16px 14px }
.photo { flex: 1; height: 92px; border-radius: 14px; background: linear-gradient(160deg, #f3f4f8, #dde1ea); display: grid; place-items: center; position: relative; overflow: hidden }
.photo span { position: absolute; right: 6px; bottom: 5px; font: 700 11px "DM Sans"; color: #fff; background: rgba(23,17,31,.55); padding: 2px 6px; border-radius: 6px }
.cand { padding: 13px 16px; position: relative }
.cand + .cand::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep) }
.cand .h { display: flex; justify-content: space-between; align-items: center }
.cand .h .code { font-size: 17px }
.cand p { font: 500 14px/1.3 "DM Sans"; color: var(--t2); margin-top: 3px }
.conf { height: 6px; border-radius: 3px; background: #f0edf5; margin-top: 9px; overflow: hidden }
.conf i { display: block; height: 100%; border-radius: 3px; background: var(--violet) }
.dpanel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 26px 26px 0 0; padding: 8px 16px 34px; box-shadow: 0 -10px 30px -12px rgba(23,17,31,.22); z-index: 4 }
.dpanel .grab { margin-bottom: 10px }
.dpanel .seg { margin: 0 0 12px }
.field { background: var(--bg); border-radius: 14px; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px }
.field span { font: 600 12px "DM Sans"; color: var(--t2); text-transform: uppercase; letter-spacing: .05em; display: block }
.field b { font: 700 17px "DM Sans"; font-variant-numeric: tabular-nums }
.field em { font: 500 15px "DM Sans"; color: var(--t3); font-style: normal }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px }
.tool { background: #fff; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(23,17,31,.05); font: 700 15.5px "DM Sans" }
.tool small { display: block; font: 500 13px "DM Sans"; color: var(--t2) }
.tool .ti { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none }
.result { margin: 0 16px; border-radius: 22px; background: linear-gradient(140deg, #1a1028, #3b1f7a); color: #fff; padding: 16px 18px 8px }
.result .k { font: 600 13px "DM Sans"; opacity: .7; text-transform: uppercase; letter-spacing: .06em }
.result .big { font: 800 36px/1.1 "DM Sans"; letter-spacing: -.03em; margin: 4px 0 10px; font-variant-numeric: tabular-nums }
.result .big small { font: 700 17px "DM Sans"; opacity: .6; margin-left: 4px }
.rl2 { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.12); font: 500 14.5px "DM Sans" }
.rl2 span { opacity: .75 } .rl2 b { font-weight: 700; font-variant-numeric: tabular-nums }
.inco { display: flex; gap: 6px }
.inco span { padding: 6px 11px; border-radius: 9px; background: #f0edf5; font: 700 13.5px "DM Sans"; color: #6f6981 }
.inco .on { background: var(--ink); color: #fff }
/* Mola */
.mola { width: 30px; height: 30px; border-radius: 15px; background: linear-gradient(140deg, #9a6bff, #5b1fd6); display: grid; place-items: center; flex: none }
.acard { align-self: stretch; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 8px 26px -12px rgba(60,30,120,.3); margin: 2px 0 0 38px; border: 1px solid #efeaf7 }
.acard .ah { padding: 14px 16px 4px }
.acard .ah span { font: 700 12px "DM Sans"; color: #9a5d00; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 6px }
.acard .ah b { display: block; font: 800 19px/1.25 "DM Sans"; letter-spacing: -.015em; margin-top: 5px }
.acard .kv { padding: 10px 16px }
.acard .kv span, .acard .kv b { font-size: 14.5px }
.acard .btns { display: flex; gap: 8px; padding: 10px 12px 12px }
.acard .btn { height: 46px; font-size: 16px; border-radius: 13px }
.mrow { display: flex; gap: 8px; align-items: flex-end }
/* journal / notifications */
.ni { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none }
.udot { width: 9px; height: 9px; border-radius: 5px; background: var(--violet); flex: none }
.ref { font: 600 13.5px "DM Sans"; color: var(--violet) }
/* justificatifs */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px }
.pc { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
.thumb { height: 120px; background: #ece9f1; position: relative; padding: 10px 14px 0; overflow: hidden }
.th { background: #fff; border-radius: 8px 8px 0 0; height: 100%; box-shadow: 0 2px 8px rgba(23,17,31,.12); overflow: hidden; transform: rotate(-1.5deg) }
.th-h { height: 18px; font: 800 9px/18px "DM Sans"; padding: 0 7px; color: #fff }
.th-amt { font: 800 15px "DM Sans"; text-align: center; margin-top: 9px; letter-spacing: -.02em }
.th-ok { font: 600 8.5px "Noto SC", "DM Sans"; color: #1c9a57; text-align: center; margin-top: 2px }
.th i { display: block; height: 4px; border-radius: 2px; background: #eceaf0; margin: 7px 9px 0 }
.ttag { position: absolute; left: 8px; bottom: 8px; box-shadow: 0 2px 6px rgba(23,17,31,.2); font: 700 11px "DM Sans"; padding: 3px 8px; border-radius: 7px; z-index: 1 }
.ttag.d { background: var(--amber); color: #fff } .ttag.p { background: var(--violet); color: #fff }
.pc .pm { padding: 9px 11px 11px }
.pc .pm b { font: 700 14px "DM Sans"; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pc .pm span { font: 500 12.5px "DM Sans"; color: var(--t2); display: block }
.pc .pm .ref { color: var(--violet); font-size: 12.5px; margin-top: 3px; display: flex; align-items: center; justify-content: space-between }
/* coordonnées */
.bmk { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 800 12px "DM Sans"; color: #fff; flex: none }
.kv .mono { font-variant-numeric: tabular-nums; font-size: 14.5px }
.minibtn { height: 34px; padding: 0 12px; border-radius: 10px; background: #f2f0f6; display: flex; align-items: center; gap: 6px; font: 700 13.5px "DM Sans"; color: var(--ink) }
.docprev { width: 118px; flex: none; background: #fff; border-radius: 10px; box-shadow: 0 6px 18px -6px rgba(23,17,31,.3); border: 1px solid #ece9f1; overflow: hidden }
.docprev .dh { background: linear-gradient(135deg, #1a1028, #3b1f7a); color: #fff; padding: 7px 8px; font: 800 7.5px "DM Sans" }
.docprev .dh small { display: block; font: 500 6.5px "DM Sans"; opacity: .7 }
.docprev .dl { display: flex; justify-content: space-between; padding: 4px 8px; font: 600 6.5px "DM Sans"; color: #4b4560; border-bottom: .5px solid #eee }
.optl { font: 700 12.5px "DM Sans"; color: var(--t2); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px 2px }
.sseg { background: #efecf4; border-radius: 11px; padding: 3px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-bottom: 12px }
.sseg div { height: 32px; border-radius: 8px; display: grid; place-items: center; font: 600 14px "DM Sans"; color: #4b4560 }
.sseg .on { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(23,17,31,.08) }
/* réglages */
.set { display: flex; align-items: center; gap: 13px; padding: 12px 16px; position: relative; font: 600 16px "DM Sans" }
.set + .set::before { content: ""; position: absolute; top: 0; left: 59px; right: 0; height: .5px; background: var(--sep) }
.set .si { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none }
.set .val { margin-left: auto; font: 500 15px "DM Sans"; color: var(--t2); display: flex; align-items: center; gap: 2px }
.lang { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 16px }
.lg { background: #fff; border-radius: 16px; height: 70px; display: grid; place-items: center; align-content: center; gap: 3px; font: 700 16px "DM Sans"; box-shadow: 0 1px 2px rgba(23,17,31,.05); border: 2px solid transparent }
.lg small { font: 500 12.5px "DM Sans"; color: var(--t2) }
.lg.on { border-color: var(--ink) }
/* lots */
.prog { height: 8px; border-radius: 4px; background: #e6e3ec; margin: 14px 40px 0; overflow: hidden; display: flex; gap: 2px }
.prog i { display: block; height: 100%; background: var(--green) }
/* cash */
.sigpad { margin: 0 16px; height: 236px; border-radius: 20px; background: #fff; border: 1.5px dashed #d9d3e6; position: relative }
.okline { margin: 0 16px 14px; background: var(--green-soft); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center }
.okline .qrs { width: 46px; height: 46px; flex: none; background: #fff; border-radius: 10px; padding: 4px }
.okline b { font: 700 15.5px "DM Sans"; color: #0f5132; display: block }
.okline span { font: 500 13.5px "DM Sans"; color: #2c6e4a }
</style></head><body>
<div class="board" id="board"></div>
<script src="../kit.js"></script>
<script>
// ---------- icônes propres au lot ----------
const s = (w, d, c = 'currentColor', sw = 2) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

  chat: (c) => s(19, '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.2A2.5 2.5 0 0 1 4 14.5z"/>', c, 2.1),
