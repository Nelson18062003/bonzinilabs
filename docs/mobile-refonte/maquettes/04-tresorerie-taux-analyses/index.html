<style>

/* taux */

/* marché */
.ad { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative }
.ad + .ad::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep) }
.ad .p { font: 800 17px "DM Sans"; letter-spacing: -.02em; width: 70px; font-variant-numeric: tabular-nums }
.tag { font: 700 11.5px "DM Sans"; padding: 3px 7px; border-radius: 6px; background: #f2f0f6; color: #4b4560 }

.mx { width: 100%; border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums }

.mx td:first-child { text-align: left; font: 600 12.5px "DM Sans"; color: var(--t2); padding-left: 2px; width: 74px }
.alrt { margin: 0 16px 12px; background: #fff; border-radius: 16px; padding: 11px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
.alrt .ai { width: 30px; height: 30px; border-radius: 10px; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; font: 800 16px "DM Sans"; flex: none }
.alrt b { font: 600 15px "DM Sans"; flex: 1 }
.alrt b small { display: block; font: 500 13px "DM Sans"; color: var(--t2) }
.nbt { font: 700 16px "DM Sans" }
.kv span.mk { color: #fff; font-family: "Noto SC", "DM Sans"; font-weight: 700 }
.strip { margin: 12px 16px 0; background: #fff; border-radius: 18px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 12px 2px; box-shadow: 0 1px 2px rgba(23,17,31,.05) }
.strip > div { padding: 0 10px; position: relative; min-width: 0 }
.strip > div + div::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: .5px; background: var(--sep) }
.strip span { font: 600 11.5px "DM Sans"; color: var(--t2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.strip em { font-style: normal; font: 700 11.5px "DM Sans"; color: #137042 } .strip em.n { color: var(--t3) }
.hr .d i { display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: var(--green); margin-left: 5px; vertical-align: 2px }
</style></head><body>

<script>
// ---------- petites aides ----------
const C = { xaf: '#e38a0b', usdt: '#1a9bb0', cny: '#7a3cf0', grid: '#efedf3', ax: '#9a95a8', ali: '#1677ff', cash: '#a2580a' };
const M = {
  usdt: '<span class="mk usdt">USDT</span>', sale: '<span class="mk sale">¥</span>', void: '<span class="mk void">USDT</span>',
  xaf: '<span class="mk xaf">CFA</span>', bn: '<span class="mk bn">BN</span>', tw: '<span class="mk tw">TW</span>',
  afb: '<span class="mk afb">AF</span>', uba: '<span class="mk uba">UBA</span>', icbc: '<span class="mk icbc">工</span>',
};
const navb = (back, t, sub = '') => `<div class="nb"><div class="back">${ic.back}${back}</div><div class="t">${t}${sub ? `<small>${sub}</small>` : ''}</div><div class="sp"></div><div class="act">${ic.dots}</div></div>`;
const r2 = (mark, name, sub, amt, meta, cls = '') => `<div class="row">${mark}<div class="rm"><div class="rn">${name}</div><div class="rs">${sub}</div></div><div class="ra"><b class="${cls}">${amt}</b><span>${meta}</span></div></div>`;
const cv = '<svg class="cv" viewBox="0 0 24 24" width="12" height="12"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const svgI = (d, c = '#17111f', s = 20, w = 2.1) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const I = {
  adj: 'M4 7h10M18 7h2M4 17h4M12 17h8M16 4v6M10 14v6',
  inv: 'M9 4h6l1 2h3v14H5V6h3zM9 12l2 2 4-4',
  plus: 'M12 5v14M5 12h14',
  users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5M16 3.5a4 4 0 0 1 0 7.5M18 15.5c2 .8 3.4 2.6 4 5.5',
  book: 'M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10',
  img: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 16l5-5 4 4 2-2 5 5M15 9h.01',
  dl: 'M12 4v11M7 10l5 5 5-5M5 20h14',
  copy: 'M9 9h10v11H9zM15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h4',
  ref: 'M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4',
  cal: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',
  undo: 'M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',
  edit: 'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',
  file: 'M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6',
  globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z',
  sl: 'M4 6h16M4 12h10M4 18h6',
  swap: 'M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4',
};
const fr = (n, d = 0) => n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ | /g, ' ');

// colonnes à bout arrondi (4px) ancrées sur la ligne de base
const col = (x, y, w, h, r = 4) => { if (h <= 0) return ''; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
// barres groupées
function bars({ W = 329, H = 150, labels, series, max, ticks, fmt = (v) => v, padL = 34, padB = 20, bw = 7, gap = 2, hi = -1, lab = [] }) {
  const pw = W - padL, ph = H - padB, n = labels.length, band = pw / n;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  ticks.forEach((t) => { const y = ph - (t / max) * ph; s += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="${t === 0 ? '#dcd8e3' : C.grid}" stroke-width="1"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-family="DM Sans" font-size="10.5" font-weight="600" fill="${C.ax}">${fmt(t)}</text>`; });
  labels.forEach((l, i) => {
    const gw = series.length * bw + (series.length - 1) * gap; const x0 = padL + i * band + (band - gw) / 2;
    series.forEach((se, k) => { const v = se.v[i]; const h = (v / max) * ph; s += `<path d="${col(x0 + k * (bw + gap), ph - h, bw, h, 3)}" fill="${se.c}" opacity="${hi >= 0 && hi !== i ? .45 : 1}"/>`; });
    if (l) s += `<text x="${padL + i * band + band / 2}" y="${H - 4}" text-anchor="middle" font-family="DM Sans" font-size="10.5" font-weight="600" fill="${C.ax}">${l}</text>`;
  });
  lab.forEach(([i, k, t]) => { const gw = series.length * bw + (series.length - 1) * gap; const x = padL + i * band + (band - gw) / 2 + k * (bw + gap) + bw / 2; const y = ph - (series[k].v[i] / max) * ph - 6; s += `<text x="${x}" y="${y}" text-anchor="middle" font-family="DM Sans" font-size="11" font-weight="700" fill="#17111f">${t}</text>`; });
  return s + '</svg>';
}
// courbes (une ou plusieurs), lavis 10 % pour la première si area
function lines({ W = 329, H = 150, series, min, max, ticks, fmt = (v) => v, padL = 34, padB = 20, xl = [], area = true, endLab = true }) {
  const pw = W - padL - 6, ph = H - padB; const n = series[0].v.length;
  const X = (i) => padL + (i / (n - 1)) * pw, Y = (v) => ph - ((v - min) / (max - min)) * ph;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  ticks.forEach((t) => { const y = Y(t); s += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="${C.grid}" stroke-width="1"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-family="DM Sans" font-size="10.5" font-weight="600" fill="${C.ax}">${fmt(t)}</text>`; });
  xl.forEach(([i, t]) => { s += `<text x="${X(i)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-family="DM Sans" font-size="10.5" font-weight="600" fill="${C.ax}">${t}</text>`; });
  series.forEach((se, k) => {
    const p = se.v.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    if (area && k === 0) s += `<path d="${p}L${X(n - 1)},${ph}L${X(0)},${ph}Z" fill="${se.c}" opacity=".10"/>`;
    s += `<path d="${p}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lx = X(n - 1), ly = Y(se.v[n - 1]);
    s += `<circle cx="${lx}" cy="${ly}" r="4.5" fill="${se.c}" stroke="#fff" stroke-width="2"/>`;
    if (endLab && se.lab) s += `<g><rect x="${lx - se.lab.length * 6.6 - 14}" y="${ly + (se.dy || -26)}" width="${se.lab.length * 6.6 + 10}" height="19" rx="6" fill="#17111f"/><text x="${lx - 9}" y="${ly + (se.dy || -26) + 13.5}" text-anchor="end" font-family="DM Sans" font-size="11.5" font-weight="700" fill="#fff">${se.lab}</text></g>`;
  });
  return s + '</svg>';
}
