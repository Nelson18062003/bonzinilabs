<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Analyses et graphiques</title>
<link rel="stylesheet" href="../kit2.css">
<style>
/* Lot 09 · Analyses et graphiques — mêmes jetons que kit2.css.
   Graphiques : encre #2C2C2C (série), gris #B3B3B3 (comparaison), grille #EEEEEE,
   étiquettes 14 px #5A5A5A. Ni dégradé, ni ombre, ni couleur de marque. */
.ch { padding: 0 20px }
.ch svg { display: block; overflow: visible }
.ch svg text, .tile svg text { font: 500 14px "DM Sans"; fill: #5A5A5A; font-variant-numeric: tabular-nums }
.kpi { padding: 18px 20px 0 }

.bub b { display: block; font: 700 17px/1.3 "DM Sans" }

/* ---------------------------------------------------------------- données

function series(total, s, trend, today = 0.32) {
  seed = s; const w = DAYS.map((_, i) => W7[wd(i)] * (trend[0] + (trend[1] - trend[0]) * i / 29) * (0.82 + 0.36 * rnd()) * (i === 29 ? today : 1));
  const sum = w.reduce((a, b) => a + b, 0); const v = w.map((x) => Math.round(x * total / sum / 10000) * 10000);
  const diff = total - v.reduce((a, b) => a + b, 0); let k = v.indexOf(Math.max(...v)); v[k] += diff; return v;
}

/* ---------------------------------------------------------------- graphiques SVG */
const GRID = '#EEEEEE', INK = '#2C2C2C', GREY = '#B3B3B3';

// barres verticales. open = index « en cours » (contour), sel = index touché (les autres s'effacent)
function vbars({ v, W = 353, H = 190, max, grid = [], xl = [], sel = -1, open = -1, gap = 3, glab = true, top = 24 }) {
  const n = v.length, bw = (W - gap * (n - 1)) / n, mn = Math.min(0, ...v), rng = max - mn, y0 = top + H * (max / rng);

    const h = Math.abs(Y(x) - y0), yy = x >= 0 ? Y(x) : y0, xx = i * (bw + gap), r = Math.min(4, bw / 2.5);

  s += `<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#D9D9D9"/>`;
  xl.forEach(([i, t, a]) => { const cx = i * (bw + gap) + bw / 2; s += `<text x="${a === 'start' ? i * (bw + gap) : a === 'end' ? i * (bw + gap) + bw : cx}" y="${top + H + 24}" text-anchor="${a || 'middle'}">${t}</text>`; });
  return s + '</svg>';
}
const barX = (i, n, W = 353, gap = 3) => { const bw = (W - gap * (n - 1)) / n; return i * (bw + gap) + bw / 2; };
const barY = (x, max, H = 190, top = 24) => top + H * (max - x) / max;
// courbes
function lines({ ser, W = 353, H = 180, min, max, grid = [], xl = [], cross = -1, top = 24, dots = true }) {
  const n = ser[0].v.length, X = (i) => 4 + i * (W - 8) / (n - 1), Y = (x) => top + H * (max - x) / (max - min);
  let s = `<svg width="${W}" height="${top + H + 30}" viewBox="0 0 ${W} ${top + H + 30}">`;
  grid.forEach((g) => { s += `<line x1="0" x2="${W}" y1="${Y(g)}" y2="${Y(g)}" stroke="${GRID}"/><text x="0" y="${Y(g) - 7}" ${halo}>${Number.isInteger(g) ? fmt(g) : String(g).replace('.', ',')}</text>`; });
  s += `<line x1="0" x2="${W}" y1="${top + H}" y2="${top + H}" stroke="#D9D9D9"/>`;
  if (cross >= 0) s += `<line x1="${X(cross)}" x2="${X(cross)}" y1="${top - 6}" y2="${top + H}" stroke="${INK}" stroke-width="1" stroke-dasharray="3 3"/>`;
  [...ser].reverse().forEach((o) => { s += `<polyline points="${o.v.map((x, i) => `${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(' ')}" fill="none" stroke="${o.c}" stroke-width="${o.w || 2.5}" stroke-linejoin="round" stroke-linecap="round"/>`; });
  if (cross >= 0 && dots) ser.forEach((o) => { s += `<circle cx="${X(cross)}" cy="${Y(o.v[cross])}" r="5.5" fill="${o.c}" stroke="#fff" stroke-width="2.5"/>`; });
  xl.forEach(([i, t, a]) => { s += `<text x="${a === 'start' ? 0 : a === 'end' ? W : X(i)}" y="${top + H + 24}" text-anchor="${a || 'middle'}">${t}</text>`; });
  return s + '</svg>';
}
const lineXY = (i, n, x, min, max, W = 353, H = 180, top = 24) => [4 + i * (W - 8) / (n - 1), top + H * (max - x) / (max - min)];
// petits graphiques des tuiles
const spBars = (v, opt = {}) => { const W = opt.W || 136, H = 28, n = v.length, g = opt.gap ?? 2, bw = (W - g * (n - 1)) / n, mx = Math.max(...v.map(Math.abs)), mn = Math.min(0, ...v), rng = mx - mn || 1, y0 = H * mx / rng;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${v.map((x, i) => { const h = Math.max(1.5, Math.abs(x) / rng * H); return `<rect x="${i * (bw + g)}" y="${x >= 0 ? y0 - h : y0}" width="${bw}" height="${h}" rx="1.5" fill="${opt.open === i ? '#fff' : INK}" ${opt.open === i ? `stroke="${INK}" stroke-width="1"` : ''}/>`; }).join('')}${mn < 0 ? `<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#D9D9D9"/>` : ''}</svg>`; };
const spLine = (v) => { const W = 136, H = 28, mn = Math.min(...v), mx = Math.max(...v); return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${v.map((x, i) => `${(i * W / (v.length - 1)).toFixed(1)},${(2 + (H - 4) * (mx - x) / (mx - mn)).toFixed(1)}`).join(' ')}" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/></svg>`; };
const spSplit = (parts) => `<svg width="136" height="28" viewBox="0 0 136 28">${(() => { let x = 0; const t = parts.reduce((a, b) => a + b[0], 0); return parts.map(([p, c]) => { const w = p / t * (136 - 2 * (parts.length - 1)); const r = `<rect x="${x}" y="9" width="${w}" height="10" rx="2" fill="${c}"/>`; x += w + 2; return r; }).join(''); })()}</svg>`;
const hrow = (left, name, sub, amt, sub2, frac) => `<div class="hrow"><div class="top2">${left}<div class="rm"><div class="rn">${name}</div>${sub ? `<div class="rs">${sub}</div>` : ''}</div><div class="ra"><b>${amt}</b>${sub2 ? `<span>${sub2}</span>` : ''}</div></div><div class="track"><i style="width:${(frac * 100).toFixed(1)}%"></i></div></div>`;
