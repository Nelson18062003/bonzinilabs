.board { width: 1800px }

.red .rn { color: #EC221F }

.ibtn { display: flex; gap: 8px; justify-content: center; align-items: center }
.ibtn svg { width: 20px; height: 20px }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.stat span { font: 500 15px "DM Sans"; color: var(--muted); display: block }
.stat b { font: 700 22px "DM Sans"; display: block; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.stat em { font: 400 14px "DM Sans"; font-style: normal; color: var(--muted); display: block; margin-top: 2px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px }
.inbox { width: 116px; height: 48px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; font: 700 20px "DM Sans"; font-variant-numeric: tabular-nums; flex: none }
.inbox.on { border: 2px solid var(--ink) }
.inbox .caret { width: 2px; height: 24px; background: var(--ink); margin-left: 2px }
.arrow { color: var(--muted); font-weight: 500; margin: 0 4px }
.chart { margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 14px 12px 10px }
.chart svg { display: block }
.chart svg text { font: 500 14px "DM Sans"; fill: #5A5A5A; font-variant-numeric: tabular-nums }
.chart .ct { font: 600 16px "DM Sans"; padding: 0 4px 8px; display: flex; justify-content: space-between }
.chart .ct span { font-weight: 500; color: var(--muted) }
.legend { display: flex; gap: 18px; padding: 10px 4px 2px; font: 500 15px "DM Sans"; color: var(--body) }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.amt .lab0 { font: 500 16px "DM Sans"; color: var(--muted); margin-bottom: 8px }
.methods.sm .m { height: 76px; gap: 6px }
.methods.sm .m .logo { width: 32px; height: 32px }
.methods.sm .m .logo svg { width: 18px; height: 18px }
.pair { position: relative; width: 44px; height: 44px; flex: none }
.pair .logo:last-child { position: absolute; right: -6px; bottom: -4px; width: 24px; height: 24px; border-radius: 12px; box-shadow: 0 0 0 2px #fff }
.pair .logo:last-child svg { width: 14px; height: 14px }
.flag { width: 44px; height: 44px; border-radius: 22px; overflow: hidden; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); position: relative }
.flag svg { width: 100%; height: 100%; display: block }
.choice { margin: 0 20px 10px; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; gap: 14px }
.choice.on { border: 2px solid var(--ink); padding: 13px 15px }
.radio { width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--field); flex: none }
.radio.on { border: 7px solid var(--ink) }
.pgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px }
.pgrid span { height: 44px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font: 600 15px "DM Sans"; font-variant-numeric: tabular-nums; white-space: nowrap }
.pgrid span.on { background: var(--ink); color: #F5F5F5 }
.chip.fl { padding-left: 6px }
.fiche .flag { margin: 0 auto }
.chip.fl .flag { width: 24px; height: 24px; border-radius: 12px }
.sec { font: 600 14px "DM Sans"; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 18px }
.thumb { margin: 16px auto 0; position: relative; overflow: hidden; border-radius: 8px; border: 1px solid var(--line) }
.thumb > div { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
.tip { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 500 15px "DM Sans"; color: var(--body); white-space: nowrap; font-variant-numeric: tabular-nums }

.tip div { display: flex; align-items: center; gap: 8px; justify-content: space-between }
.tip i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle }
.apps { display: flex; justify-content: space-between; padding: 18px 0 14px; border-bottom: 1px solid var(--line) }
.apps div { display: grid; justify-items: center; gap: 8px; font: 500 14px "DM Sans"; color: var(--body); width: 64px; text-align: center }
.apps .ap { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center }

.kv .pen { font: 600 16px "DM Sans"; text-decoration: underline; text-underline-offset: 3px; color: var(--strong); margin-left: 8px }

const chev = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="#5A5A5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const navb = (t, right = '') => `<div class="nav">${I.back}<div class="t">${t}</div>${right}</div>`;

const mrow = (icon, t, s = '', cls = '') => `<div class="mrow ${cls}"><div class="av">${icon}</div><div class="rm"><div class="rn">${t}</div>${s ? `<div class="rs">${s}</div>` : ''}</div></div>`;

const WA = 'M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z';
const waIcon = (c = '#F5F5F5', s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${WA}" fill="${c}"/></svg>`;

/* ---------- drapeaux (identité des pays, comme les logos) ---------- */
const star = (cx, cy, r, c) => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .4 : r; p += `${i ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(2)} ${(cy + rr * Math.sin(a)).toFixed(2)}`; } return `<path d="${p}Z" fill="${c}"/>`; };

  CN: `<rect width="30" height="30" fill="#EE1C25"/>${star(10, 10, 5.5, '#FFFF00')}`,
};
const flag = (iso, s = 44) => `<div class="flag" style="width:${s}px;height:${s}px;border-radius:${s / 2}px"><svg viewBox="0 0 30 30" preserveAspectRatio="none">${FLAG[iso]}</svg></div>`;
const flagRect = (iso, w, h, r) => `<svg width="${w}" height="${h}" viewBox="0 0 30 30" preserveAspectRatio="none" style="border-radius:${r}px;box-shadow:0 0 0 2px #e8e4ee;flex-shrink:0;display:block">${FLAG[iso]}</svg>`;

/* ---------- graphiques : encre #2C2C2C, gris #B3B3B3, grille #D9D9D9 ---------- */
// Courbe d'une journée (marché) avec notre taux publié en marches grises.
const dayChart = () => {
  const W = 327, H = 168, L = 4, Rr = 66, lo = 10802, hi = 10884;
  const t0 = 6 * 60, t1 = 10 * 60 + 20;
  const x = (m) => L + (m - t0) / (t1 - t0) * (W - L - Rr), y = (v) => 8 + (hi - v) / (hi - lo) * (H - 16);
  const mk = [10848, 10852, 10846, 10855, 10861, 10858, 10866, 10872, 10869, 10864, 10871, 10876, 10868, 10874];
  const pts = mk.map((v, i) => `${x(t0 + i * 20).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ours = `${x(t0)},${y(10812)} ${x(480)},${y(10812)} ${x(480)},${y(10838)} ${x(t1)},${y(10838)}`;
  const grid = [10810, 10840, 10870].map((v) => `<line x1="0" x2="${W - Rr + 6}" y1="${y(v)}" y2="${y(v)}" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="2 4"/><text x="${W}" y="${y(v) + 5}" text-anchor="end">${fmt(v)}</text>`).join('');
  const lx = x(t1);
  return `<svg width="${W}" height="${H + 26}" viewBox="0 0 ${W} ${H + 26}">${grid}
    <polyline points="${ours}" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linejoin="round"/>

    <circle cx="${lx}" cy="${y(mk[13])}" r="5" fill="#2C2C2C" stroke="#fff" stroke-width="2"/>
    <circle cx="${lx}" cy="${y(10838)}" r="5" fill="#B3B3B3" stroke="#fff" stroke-width="2"/>
    ${[['06:00', 360], ['08:00', 480], ['10:00', 600]].map(([l, m]) => `<text x="${x(m)}" y="${H + 20}" text-anchor="${m === 360 ? 'start' : 'middle'}">${l}</text>`).join('')}</svg>`;
};
// Distribution des annonces (carnet Cameroun), un palier sélectionné à l'encre.
const histo = () => {
  const c = [5, 9, 14, 20, 27, 31, 38, 24, 18, 12, 8, 6, 5], b0 = 596, W = 327, H = 150, gap = 3, bw = (W - gap * (c.length - 1)) / c.length, max = 40;

    ${[596, 599, 602, 605, 608].map((v) => { const i = v - b0; return `<text x="${v === 608 ? W : i * (bw + gap) + bw / 2}" y="${H + 44}" text-anchor="${v === 608 ? 'end' : 'middle'}">${v}</text>`; }).join('')}</svg>`;
};

};

/* ---------- l'image de cotation (RateQuoteCard, 1080 × 1080) ---------- */
const quoteCard = ({ xaf, cny, rate, m = 'alipay', mName = 'Alipay', mCn = '支付宝', dark = true, country = '' }) => {
  const bg = dark ? '#0D0C14' : '#F2F0F8', card = dark ? '#19172A' : '#FFFFFF', text = dark ? '#F1EEF8' : '#1A1726', muted = '#8B83A0', ym = dark ? '#5C5772' : '#C3BDD2', hair = dark ? 'rgba(255,255,255,0.10)' : 'rgba(26,23,38,0.10)', sh = dark ? '0 0 0 1px rgba(255,255,255,0.06)' : '0 18px 50px -22px rgba(40,28,80,0.28)';

  const SC = 'font-family:"Noto Sans SC",sans-serif';
  return `<div style="width:1080px;height:1080px;background:${bg};display:flex;flex-direction:column;padding:56px 64px;font-family:'DM Sans'">

      <div style="display:flex;align-items:center;gap:22px"><img src="bonzini-logo.jpg" width="92" height="92" style="border-radius:24px">
