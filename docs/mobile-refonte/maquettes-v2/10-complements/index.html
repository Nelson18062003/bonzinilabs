<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Compléments</title>
<link rel="stylesheet" href="../kit2.css">
<style>
/* Lot 10 — Compléments (écrans desktop sans capture dans 01–06). Mêmes jetons que kit2.css. */
@font-face { font-family: "Noto Sans SC"; font-weight: 400; src: url(../noto-sans-sc-chinese-simplified-400-normal.woff2) format("woff2") }
@font-face { font-family: "Noto Sans SC"; font-weight: 700; src: url(../noto-sans-sc-chinese-simplified-700-normal.woff2) format("woff2") }
body { font-family: "DM Sans", "Noto Sans SC", sans-serif }
.cn { font-family: "DM Sans", "Noto Sans SC" !important }
.ic24 { width: 24px; height: 24px; flex: none }
.chev { width: 20px; height: 20px; flex: none }
.fiche .av { width: 64px; height: 64px; border-radius: 32px; font-size: 22px; margin: 0 auto }
.fiche .nm { font: 600 20px "DM Sans"; margin-top: 12px }
.fiche .big small { font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: 0 }
.fiche .line { font: 500 16px "DM Sans"; color: var(--body); margin-top: 10px }
.fiche .line b { font-weight: 700 }
.acts { align-items: start } .act { align-content: start }
.acts.three { grid-template-columns: repeat(3, 1fr); padding: 22px 34px 6px }
.acts.two { grid-template-columns: repeat(2, 1fr); padding: 22px 70px 6px }
.inp { margin: 0 20px; min-height: 56px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 500 17px "DM Sans"; color: var(--strong) }
.inp.hint { color: var(--faint); font-weight: 400 }
.inp.lock { background: var(--soft); border-color: var(--line); color: var(--muted) }
.inp.area { align-items: flex-start; padding: 14px 16px; min-height: 96px; font: 400 17px/1.4 "DM Sans"; color: var(--body) }
.inp.on { border: 2px solid var(--ink) }
.inp .r2 { margin-left: auto; font: 600 16px "DM Sans"; color: var(--muted) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 20px }
.two .inp, .two .field { margin: 0 }
.lbl.s { padding-top: 18px; padding-bottom: 8px }
.lbl.t { padding-top: 14px; padding-bottom: 8px }
.flag { width: 24px; height: 16px; border-radius: 2px; overflow: hidden; display: flex; flex: none }
.flag i { flex: 1 }
.pre { font: 600 17px "DM Sans"; padding-right: 10px; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; height: 30px }
.chips { overflow: hidden; flex-wrap: nowrap }
.chips.wrap { flex-wrap: wrap }
.chip b { font-weight: 700 }
.srow { display: flex; align-items: center; gap: 16px; height: 54px; border-bottom: 1px solid var(--line); font: 600 17px "DM Sans" }
.srow:last-child { border-bottom: 0 }
.srow .x { margin-left: auto; font: 400 15px "DM Sans"; color: var(--muted) }
.srow.red { color: #EC221F }
.sw { width: 51px; height: 31px; border-radius: 16px; background: var(--ink); position: relative; flex: none }
.sw::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff }
.sw.off { background: var(--line) }
.sw.off::after { right: auto; left: 2px }
.steps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 14px 20px 0 }
.steps i { height: 4px; border-radius: 2px; background: var(--line) }
.steps i.on { background: var(--ink) }
.ttl { font: 700 26px/1.2 "DM Sans"; letter-spacing: -.02em; padding: 20px 20px 0 }
.pwd { font: 700 30px "DM Sans"; letter-spacing: .06em; font-variant-numeric: tabular-nums }
.seg.three { grid-template-columns: repeat(3, 1fr) }
.seg span + span { border-left: 1px solid var(--line) }
.seg .on + span, .seg span.on { border-left: 0 }
.who .tag { margin-top: 0 }
.st { width: 44px; height: 44px; border-radius: 22px; flex: none; display: grid; place-items: center; background: var(--soft) }
.st.ok { background: #CFF7D3 } .st.now { background: var(--ink) } .st.bad { background: #FDD3D0 } .st.todo { background: #FFF1C2 }
.st.empty { background: #fff; border: 2px solid var(--field) }
.st svg { width: 22px; height: 22px }
.ph { display: block; flex: none; border-radius: 8px }
.gauge { height: 10px; border-radius: 5px; background: var(--soft); margin-top: 12px; overflow: hidden }
.gauge i { display: block; height: 100%; background: var(--ink); border-radius: 5px }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 12px }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 4px }
.field.on { border: 2px solid var(--ink) }
.field.md { font-size: 22px; height: 56px; white-space: nowrap; justify-content: space-between; padding: 0 14px }
.field.md small { font-size: 15px }
/* cases à cocher et radios */
.ck { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--field); flex: none; display: grid; place-items: center }
.ck.on { background: var(--ink); border-color: var(--ink) }
.rd { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--field); flex: none }
.rd.on { border: 8px solid var(--ink) }
/* grandes options (choix plein écran) */
.opt { margin: 10px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; gap: 14px; align-items: center }
.opt.on { border: 2px solid var(--ink); padding: 13px 15px }
.opt > div > b { display: block; font: 600 17px "DM Sans" }
.opt > div > span:not(.pre):not(.rd) { display: block; font: 400 15px/1.3 "DM Sans"; color: var(--muted); margin-top: 2px }
/* tuiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px }
.tiles.two { grid-template-columns: 1fr 1fr; margin: 0; gap: 10px }
.tiles.four { grid-template-columns: repeat(4, 1fr) }
.tl { border: 1px solid var(--line); border-radius: 8px; min-height: 56px; display: grid; place-items: center; text-align: center; font: 600 16px/1.2 "DM Sans"; padding: 8px 6px }
.tl.on { border: 2px solid var(--ink) }
.tl small { display: block; font: 400 14px "DM Sans"; color: var(--muted); margin-top: 2px }
/* chiffres en grille */
.g4 { display: grid; grid-template-columns: 1fr 1fr; margin: 18px 20px 0; border: 1px solid var(--line); border-radius: 8px }
.g4 div { padding: 14px 16px; border-bottom: 1px solid var(--line) }
.g4 div:nth-child(odd) { border-right: 1px solid var(--line) }
.g4 div:nth-last-child(-n+2) { border-bottom: 0 }
.g4 span { display: block; font: 400 15px "DM Sans"; color: var(--muted) }
.g4 b { display: block; font: 700 24px "DM Sans"; letter-spacing: -.01em; margin-top: 4px; font-variant-numeric: tabular-nums }
.g4 b small { font: 600 15px "DM Sans"; color: var(--muted) }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px }
.g3 div { padding: 12px 14px } .g3 div + div { border-left: 1px solid var(--line) }
.g3 span { display: block; font: 400 14px "DM Sans"; color: var(--muted) }
.g3 b { display: block; font: 700 22px "DM Sans"; margin-top: 2px; font-variant-numeric: tabular-nums }
.mini-btn { height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; font: 600 15px "DM Sans"; flex: none }
.rbtn { width: 44px; height: 44px; border-radius: 22px; background: var(--soft); display: grid; place-items: center; flex: none }
.rbtn svg { width: 22px; height: 22px }
.link { font: 600 16px "DM Sans"; text-decoration: underline; text-underline-offset: 3px }
.okline { display: flex; align-items: center; gap: 8px; margin: 10px 20px 0; font: 600 15px "DM Sans" }
.dock .btn + .btn, .dock .btn + .duo { margin-top: 10px }
.duo .btn { margin-top: 0 !important }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.sheet .lbl { padding: 16px 0 8px }
.sheet .inp { margin: 0 }
.sheet .tiles { padding: 0 }
.sheet .chips { padding: 0 }
.btn.red { background: #EC221F; color: #fff }
.redt { color: #EC221F; font: 600 17px "DM Sans"; text-align: center; margin-top: 16px }
/* ligne de route Nansha → Douala */
.route { padding: 18px 20px 0 }
.ends { display: flex; justify-content: space-between; align-items: flex-end }
.ends b { display: block; font: 700 22px/1.15 "DM Sans"; letter-spacing: -.01em }
.ends span { font: 400 15px "DM Sans"; color: var(--muted) }
.ends .r { text-align: right }
.track { position: relative; height: 32px; margin-top: 10px }
.track .ln { position: absolute; left: 6px; right: 6px; top: 14px; height: 4px; border-radius: 2px; background: var(--line) }
.track .fl { position: absolute; left: 6px; top: 14px; height: 4px; border-radius: 2px; background: var(--ink) }
.track .a { position: absolute; left: 0; top: 9px; width: 14px; height: 14px; border-radius: 7px; background: var(--ink) }
.track .b { position: absolute; right: 0; top: 9px; width: 14px; height: 14px; border-radius: 7px; background: #fff; border: 3px solid var(--line) }
.track .boat { position: absolute; top: 0; width: 32px; height: 32px; border-radius: 16px; background: var(--ink); display: grid; place-items: center }
.track .boat svg { width: 18px; height: 18px }
.eta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font: 500 16px "DM Sans"; color: var(--body) }
.eta b { font-weight: 700; color: var(--strong) }
.eta .tag { margin-top: 0 }
.eta span.pm { color: var(--muted); font-weight: 400 }
.who .tag { font: 600 14px/1 "DM Sans" } .who .t-ok { color: #02542D }
.acts { align-items: start } .act { align-content: start }
.stepper { display: flex; align-items: center; gap: 14px; font: 700 20px "DM Sans" } .stepper i { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); display: grid; place-items: center; font: 500 24px "DM Sans"; font-style: normal }
.stags { display: flex; gap: 8px; padding: 14px 20px 0 }
.stags .tag { margin-top: 0; padding: 7px 10px }
.seg4 { grid-template-columns: .8fr 1.3fr .8fr .85fr }
.seg4 span { font-size: 15px; padding: 11px 0 }
/* carte (lot cargo) */
.mapw { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #fff; overflow: hidden }
.pinv { position: absolute; width: 40px; height: 40px; border-radius: 20px; background: var(--ink); display: grid; place-items: center; border: 3px solid #fff }
.pinv svg { width: 20px; height: 20px }
.pinv .n { position: absolute; top: -6px; right: -8px; background: #fff; border: 1px solid var(--ink); color: var(--strong); font: 700 12px/18px "DM Sans"; min-width: 20px; height: 20px; border-radius: 10px; text-align: center }
.port { position: absolute; font: 600 14px "DM Sans"; color: var(--body); display: flex; align-items: center; gap: 6px }
.port i { width: 10px; height: 10px; border-radius: 5px; background: #fff; border: 2px solid var(--ink) }
/* étiquette colis / instruction */
.paper { margin: 16px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 16px }
.paper .hd { display: flex; justify-content: space-between; align-items: center; font: 700 15px "DM Sans"; letter-spacing: .04em; padding-bottom: 12px; border-bottom: 1px solid var(--line) }
.paper .code { font: 800 40px/1 "DM Sans"; letter-spacing: -.01em }
.paper .zh { font: 400 15px/1.45 "Noto Sans SC", "DM Sans"; color: var(--body) }
.paper .q { width: 104px; height: 104px }
/* bulle de message */
.bub { margin: 0 20px; background: var(--ink); color: #F5F5F5; border-radius: 16px 16px 4px 16px; padding: 12px 14px; font: 400 16px/1.4 "DM Sans" }
/* histogramme */
.chart { margin: 0 20px; height: 150px; display: flex; align-items: flex-end; gap: 12px; padding: 0 4px; border-bottom: 1px solid var(--line) }
.chart .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px }
.chart .c i { display: block; border-radius: 3px 3px 0 0 }
.chart .c i.k { background: var(--ink); border-radius: 0 }
.chart .c i.g { background: #B3B3B3 }
.cx { display: flex; gap: 12px; margin: 6px 20px 0; padding: 0 4px }
.cx span { flex: 1; text-align: center; font: 500 14px "DM Sans"; color: var(--muted) }
.leg { display: flex; gap: 16px; margin: 10px 20px 0; font: 500 14px "DM Sans"; color: var(--body) }
.leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px }
.face { width: 96px; height: 96px; margin: 0 auto }
.brand { font: 800 22px "DM Sans"; letter-spacing: .06em }
.handle { display: grid; gap: 4px; flex: none; padding: 0 2px } .handle i { width: 18px; height: 2px; border-radius: 1px; background: #949494 }
</style></head><body>
<div class="board" id="board"></div>
<script src="../kit2.js"></script>
<script src="helpers.js"></script>
<script src="m1-operations.js"></script>
<script src="m2-clients.js"></script>
<script src="m3-equipe.js"></script>
<script src="m4-commercial.js"></script>
<script src="m5-cargo.js"></script>
<script src="m6-douane.js"></script>
<script src="m7-messages.js"></script>
<script src="m8-reglages.js"></script>
<script>render();</script>
</body></html>
