<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../kit2.css">
<style>
/* Lot 02 · Opérations — mêmes jetons que kit2.css (#2C2C2C, #D9D9D9, rayon 8, aucune ombre). */
.fiche .big small { font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: 0 }
.lnk { text-decoration: underline; text-underline-offset: 3px }
/* menu « … » en feuille */
.mi { display: flex; align-items: center; gap: 14px; height: 54px; border-bottom: 1px solid var(--line); font: 500 17px "DM Sans"; color: var(--strong) }
.mi:last-child { border-bottom: 0 }
.mi svg { width: 24px; height: 24px; flex: none }
.mi .sp { flex: 1 }
.mi .v { font: 400 16px "DM Sans"; color: var(--muted) }
.mi.red { color: #EC221F }
.mi:has(+ .gap) { border-bottom: 0 }
.mi.gap { border-top: 8px solid var(--soft); margin: 0 -20px; padding: 0 20px }
/* interrupteur */
.sw { width: 51px; height: 31px; border-radius: 16px; background: #D9D9D9; position: relative; flex: none }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 13px; background: #fff }
.sw.on { background: var(--ink) } .sw.on::after { left: 23px }
/* éléments dans une feuille */
.sheet .lbl { padding: 18px 0 2px }
.sheet .chips { padding: 8px 0 0; flex-wrap: wrap }
.sheet .methods { padding: 8px 0 0 }
.sheet .h { display: flex; justify-content: space-between; align-items: baseline }
.sheet .h a { font: 600 16px "DM Sans"; text-decoration: underline; text-underline-offset: 3px; color: var(--strong) }
.ta { margin-top: 8px; min-height: 92px; border: 1px solid var(--field); border-radius: 8px; padding: 13px 16px; font: 400 16px/1.4 "DM Sans"; color: var(--body) }
.ta.ph { color: var(--faint) }
.srow { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font: 600 17px "DM Sans" }
.alink { display: inline-block; margin-top: 14px; font: 600 16px "DM Sans"; text-decoration: underline; text-underline-offset: 3px }
/* la preuve (photo du reçu) */
.photo { margin: 16px 20px 0; height: 172px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); display: grid; place-items: center; position: relative; overflow: hidden }
.photo .n { position: absolute; top: 10px; right: 10px; margin: 0; background: #fff; border: 1px solid var(--line) }
.rcpt { width: 184px; height: 148px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 14px 0; display: grid; justify-items: center; align-content: start; gap: 6px; transform: rotate(-2deg) }
.rcpt .ok { width: 30px; height: 30px; border-radius: 15px; background: #CFF7D3; display: grid; place-items: center }
.rcpt b { white-space: nowrap; font: 700 18px "DM Sans"; font-variant-numeric: tabular-nums }
.rcpt span { font: 500 14px "DM Sans"; color: var(--muted) }
.bar { height: 7px; border-radius: 4px; background: #E6E6E6; width: 100% }
/* vignettes */
.thumbs { display: flex; gap: 12px; padding: 10px 20px 0 }
.th { width: 104px; display: grid; gap: 6px; font: 500 14px "DM Sans"; color: var(--body); text-align: center }
.th .im { height: 120px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); display: grid; place-items: center }
.th .im.add { background: #fff; border: 1.5px dashed var(--field); font: 400 30px "DM Sans" }
.mini { width: 62px; height: 84px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 8px 7px; display: grid; gap: 5px; align-content: start }
/* suivi */
.tl { padding: 18px 20px 0 }
.ti { display: flex; gap: 14px; position: relative; padding-bottom: 20px }
.ti:not(:last-child)::before { content: ''; position: absolute; left: 11px; top: 28px; bottom: 4px; width: 2px; background: var(--line) }
.ti .d { width: 24px; height: 24px; border-radius: 12px; background: var(--ink); flex: none; display: grid; place-items: center; margin-top: 1px }
.ti .d.now { background: #FFF1C2; box-shadow: none; border: 2px solid #682D03 }
.ti .d.todo { background: #fff; border: 2px solid var(--line) }
.ti b { display: block; font: 600 17px/1.3 "DM Sans" }
.ti span { display: block; font: 400 15px/1.3 "DM Sans"; color: var(--muted); margin-top: 2px }
/* saisie */
.inp { margin: 0 20px; height: 56px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; padding: 0 16px; font: 500 17px "DM Sans"; color: var(--strong) }
.inp.ph { color: var(--faint); font-weight: 400 }
.sig { margin: 0 20px; height: 150px; border: 1px solid var(--field); border-radius: 8px; position: relative }
.sig .e { position: absolute; top: 10px; right: 14px; font: 600 15px "DM Sans"; text-decoration: underline; text-underline-offset: 3px }
.sig .base { position: absolute; left: 18px; right: 18px; bottom: 34px; border-top: 1px dashed var(--field) }
.ck { display: flex; align-items: center; gap: 12px; margin: 18px 20px 0; font: 600 17px "DM Sans" }
.ck .bx { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); display: grid; place-items: center; flex: none }
/* caméra */
.ab:has(.camroot) { background: #141414; color: #F5F5F5 }
.ab:has(.camroot) .sbar svg { fill: #fff } .ab:has(.camroot) .sbar rect[stroke] { stroke: #fff }
.ab:has(.camroot) .home-ind { background: #fff }
.frame { position: absolute; left: 50%; top: 196px; transform: translateX(-50%); width: 260px; height: 260px }
.frame > i { position: absolute; width: 46px; height: 46px; border: 0 solid #fff }
.frame > i:nth-child(1) { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 14px }
.frame > i:nth-child(2) { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 14px }
.frame > i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 14px }
.frame > i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 14px }
.frame .q { position: absolute; inset: 40px; background: #fff; border-radius: 10px; display: grid; place-items: center }
.frame .q .qr { width: 156px; height: 156px; border: 0; padding: 4px }
.cbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid #5A5A5A; display: grid; place-items: center }
.btn.ghost { background: transparent; color: #F5F5F5; border: 1px solid #F5F5F5 }
/* lot : barre d'avancement */
.prog { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 210px; margin: 14px auto 0 }
.prog i { height: 6px; border-radius: 3px; background: var(--line) } .prog i.k { background: var(--ink) }
</style></head><body><div class="board" id="board"></div>
