<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit2.css">
<style>
/* Lot 01 · Navigation — mêmes jetons que kit2.css (blanc, filet #D9D9D9, rayon 8, encre #2C2C2C, aucune ombre). */
/* Plus : la carte profil, puis les modules en grille de ronds (façon Wave) */
.me { display: flex; align-items: center; gap: 14px; margin: 12px 20px 0; padding: 14px 14px 14px 16px; border: 1px solid var(--line); border-radius: 8px }
.me .av { width: 52px; height: 52px; border-radius: 26px; font-size: 19px }
.me b { display: block; font: 600 18px "DM Sans" }
.me span { font: 400 15px "DM Sans"; color: var(--muted) }
.chev { flex: none }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 24px; padding: 26px 10px 0 }
.mod { display: grid; justify-items: center; align-content: start; gap: 9px; font: 600 15px/1.25 "DM Sans"; text-align: center; color: var(--strong); padding: 0 6px }
.mod .r { width: 64px; height: 64px; border-radius: 32px; background: var(--soft); display: grid; place-items: center; position: relative; color: var(--strong) }
.mod .r svg { width: 28px; height: 28px }
.mod .r.pic { background: #fff; box-shadow: none; border: 1px solid var(--line) }
.mod .r.pic img { width: 100%; height: 100%; border-radius: 32px; object-fit: cover }
.mod .b { position: absolute; top: -2px; right: -4px; background: #EC221F; color: #fff; font: 700 13px/22px "DM Sans"; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; text-align: center; border: 2px solid #fff; box-sizing: content-box }
/* lignes de réglage */
.set { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0; border-bottom: 1px solid var(--line) }
.set:last-child { border-bottom: 0 }
.set .ic { width: 24px; height: 24px; flex: none }
.set .l { flex: 1; font: 500 17px "DM Sans"; color: var(--strong) }
.set .v { font: 400 16px "DM Sans"; color: var(--muted) }
.set .s { display: block; font: 400 15px "DM Sans"; color: var(--muted); margin-top: 2px }
.sw { width: 51px; height: 31px; border-radius: 16px; background: var(--ink); position: relative; flex: none }
.sw::after { content: ""; position: absolute; top: 2px; left: 22px; width: 27px; height: 27px; border-radius: 14px; background: #fff }
.sw.off { background: #D9D9D9 }
.sw.off::after { left: 2px }
.lbl2 { font: 600 14px "DM Sans"; color: var(--muted); padding: 20px 20px 2px; text-transform: uppercase; letter-spacing: .05em }
.ident { text-align: center; padding: 20px 20px 4px }
.ident .av { width: 72px; height: 72px; border-radius: 36px; font-size: 26px; margin: 0 auto }
.ident b { display: block; font: 700 24px "DM Sans"; margin-top: 12px; letter-spacing: -.01em }
.ident span { display: block; font: 400 16px "DM Sans"; color: var(--muted); margin-top: 4px }
.ident .edit { display: inline-flex; color: var(--strong); align-items: center; height: 40px; padding: 0 16px; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; font: 600 15px "DM Sans" }
/* scanner : la caméra */
.camv { position: absolute; inset: 0; background: #1A1A1A }
.ab:has(.camv) .sbar { color: #fff; z-index: 3 }
.ab:has(.camv) .sbar svg { fill: #fff }
.ab:has(.camv) .sbar svg rect[stroke] { stroke: #fff }
.ctop { position: absolute; top: 62px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 3 }
.ctop .t { font: 600 18px "DM Sans"; color: #fff }
.glass svg { width: 24px; height: 24px }
.glass { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.16); display: grid; place-items: center }
.vf { position: absolute; top: 196px; left: 50%; width: 270px; height: 270px; margin-left: -135px; z-index: 2 }
.vf > i { position: absolute; width: 46px; height: 46px; border: 0 solid #fff }
.vf > i:nth-child(1) { top: 0; left: 0; border-width: 5px 0 0 5px; border-radius: 14px 0 0 0 }
.vf > i:nth-child(2) { top: 0; right: 0; border-width: 5px 5px 0 0; border-radius: 0 14px 0 0 }
.vf > i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 5px 5px; border-radius: 0 0 0 14px }
.vf > i:nth-child(4) { bottom: 0; right: 0; border-width: 0 5px 5px 0; border-radius: 0 0 14px 0 }
.card { position: absolute; top: 58px; left: 24px; width: 222px; height: 150px; background: #fff; border-radius: 10px; transform: rotate(-5deg); padding: 12px 12px; display: flex; gap: 12px; align-items: center }
.card .qr { width: 86px; height: 86px; padding: 4px; border: 0 }
.card .w { font: 700 14px "DM Sans"; letter-spacing: .08em }
.card .n { font: 600 15px/1.2 "DM Sans"; margin-top: 18px }
.card .c { font: 700 16px "DM Sans"; margin-top: 4px; font-variant-numeric: tabular-nums }
.chint { position: absolute; top: 494px; left: 0; right: 0; text-align: center; font: 600 17px "DM Sans"; color: #fff; z-index: 2 }
.cbtm { position: absolute; bottom: 64px; left: 0; right: 0; display: flex; justify-content: center; gap: 56px; z-index: 2 }
.cbtm .act { color: #fff }
.cbtm .act .r { background: rgba(255,255,255,.16) }
/* recherche */
.sbox { display: flex; align-items: center; gap: 12px; padding: 10px 20px 0 }
.sbox .search { margin: 0; flex: 1; border: 2px solid var(--ink); color: var(--strong) }
.sbox .search .caret { width: 2px; height: 22px; background: var(--ink); margin-left: -8px }
.sbox .x { margin-left: auto; width: 22px; height: 22px; border-radius: 11px; background: #949494; display: grid; place-items: center }
.sbox .cancel { font: 600 16px "DM Sans" }
.rn mark { background: none; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px }
/* menu « … » en feuille */
.mi { display: flex; align-items: center; gap: 14px; min-height: 56px; border-bottom: 1px solid var(--line); font: 500 17px "DM Sans" }
.mi:last-child { border-bottom: 0 }
.mi svg { width: 24px; height: 24px; flex: none }
/* le tableau des rôles */
.ab.wide { width: 1260px; height: auto; border-radius: 8px; box-shadow: none; border: 1px solid var(--line); display: block; padding: 48px 56px 48px }
.wide h1 { font: 700 34px "DM Sans"; letter-spacing: -.02em }
.wide .sub1 { font: 400 18px "DM Sans"; color: var(--muted); margin-top: 6px }
.flow { display: flex; align-items: center; gap: 40px; margin-top: 36px }
.login { width: 330px; flex: none; border: 1px solid var(--line); border-radius: 8px; padding: 28px 24px 26px }
.login .wm { font: 700 22px "DM Sans"; letter-spacing: .06em }
.login .wm small { font: 600 14px "DM Sans"; letter-spacing: .05em; color: var(--muted); margin-left: 6px }
.login h2 { font: 700 26px "DM Sans"; margin-top: 26px }
.login .f { height: 52px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; padding: 0 14px; font: 400 17px "DM Sans"; color: var(--body); margin-top: 12px }
.login .f.ph { color: var(--faint) }
.login .btn { margin-top: 18px }
.login .fid { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; font: 600 16px "DM Sans" }
.arrow { flex: none }
.roles { flex: 1; display: grid; gap: 14px }
.rl { display: flex; align-items: center; gap: 22px }
.rl .rw { width: 300px; flex: none }
.rl .rw b { display: block; font: 600 18px "DM Sans" }
.rl .rw span { display: block; font: 400 15px "DM Sans"; color: var(--muted); margin-top: 3px }
.rl .bar { width: 393px; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.rl .bar .tabs { border-top: 0; padding: 10px 4px 10px }
</style></head><body>
<div class="board" id="board"></div>
<script src="../kit2.js"></script>
<script>
