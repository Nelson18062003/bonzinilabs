<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face { font-family: "DM Sans"; font-weight: 400; src: url(dm-sans-latin-400-normal.woff2) format("woff2") }
@font-face { font-family: "DM Sans"; font-weight: 500; src: url(dm-sans-latin-500-normal.woff2) format("woff2") }
@font-face { font-family: "DM Sans"; font-weight: 600; src: url(dm-sans-latin-600-normal.woff2) format("woff2") }
@font-face { font-family: "DM Sans"; font-weight: 700; src: url(dm-sans-latin-700-normal.woff2) format("woff2") }
* { box-sizing: border-box; margin: 0; padding: 0 }
/* Le kit BONZINI HQ (src/mobile/designKit/tokens.ts) : blanc, filet #D9D9D9,
   rayon 8, un seul primaire #2C2C2C, la couleur ne porte que le statut, aucune ombre. */
:root { --ink: #2C2C2C; --strong: #1E1E1E; --body: #303030; --muted: #5A5A5A; --faint: #757575; --line: #D9D9D9; --soft: #F5F5F5; --field: #949494 }
body { background: #e9e9ec; font-family: "DM Sans", sans-serif; color: var(--strong); -webkit-font-smoothing: antialiased }
.board { display: flex; flex-wrap: wrap; gap: 44px; padding: 48px; width: 2000px }
.shot { display: grid; gap: 14px; justify-items: center }
.cap { font: 600 17px "DM Sans"; color: #444; text-align: center }
.ab { width: 393px; height: 852px; border-radius: 52px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 0 0 10px #111, 0 30px 60px -20px rgba(0,0,0,.35); display: flex; flex-direction: column }
.sbar { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 34px 0 42px; font: 600 17px "DM Sans"; position: relative }
.sbar .di { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000 }
.sbar .ic { display: flex; gap: 6px; align-items: center }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: #111; z-index: 9 }
.body { flex: 1; overflow: hidden; position: relative }
.pad { padding: 0 20px }
/* barre d'onglets */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 4px 32px; border-top: 1px solid var(--line); background: #fff }
.tab { display: grid; justify-items: center; gap: 4px; font: 600 12px "DM Sans"; color: var(--faint); position: relative }
.tab.on { color: var(--strong) }
.tab svg { width: 26px; height: 26px }
.tab .b { position: absolute; top: -4px; left: calc(50% + 6px); background: #EC221F; color: #fff; font: 700 12px/18px "DM Sans"; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; text-align: center }
/* en-têtes */
.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 0; height: 56px }
.hello { font: 600 24px "DM Sans"; letter-spacing: -.02em }
.icbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); display: grid; place-items: center; position: relative }
.icbtn .dot { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 5px; background: #EC221F }
.nav { height: 56px; display: flex; align-items: center; gap: 6px; padding: 0 16px 0 10px; border-bottom: 1px solid var(--line) }
.nav .t { font: 600 18px "DM Sans"; flex: 1 }
.nav .step { font: 600 16px "DM Sans"; color: var(--muted) }
/* le chiffre du jour, façon Wave */
.hero { margin: 14px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 18px 18px 16px }
.hero .lab { font: 500 16px "DM Sans"; color: var(--muted) }
.hero .num { font: 700 40px/1.1 "DM Sans"; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums }
.hero .num small { font-size: 20px; font-weight: 600; color: var(--muted) }
.hero .sub { font: 500 16px "DM Sans"; color: var(--body); margin-top: 8px; display: flex; gap: 16px }
.hero .sub b { font-weight: 700 }
/* les gros boutons ronds, façon Wave */
.acts { display: grid; grid-template-columns: repeat(4, 1fr); padding: 22px 14px 6px }
.act { display: grid; justify-items: center; gap: 9px; font: 600 15px/1.2 "DM Sans"; text-align: center; color: var(--strong) }
.act .r { width: 64px; height: 64px; border-radius: 32px; background: var(--soft); display: grid; place-items: center }
.act .r.ink { background: var(--ink) }
.act .r svg { width: 28px; height: 28px }
.h2 { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 6px }
.h2 b { font: 600 20px "DM Sans" }
.h2 a { font: 600 16px "DM Sans"; color: var(--strong); text-decoration: underline; text-underline-offset: 3px }
/* lignes */
.list { padding: 0 20px }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line) }
.row:last-child { border-bottom: 0 }
.logo { width: 44px; height: 44px; border-radius: 22px; flex: none; display: grid; place-items: center; overflow: hidden }
.logo svg { width: 24px; height: 24px }
.logo img { width: 100%; height: 100% ; object-fit: cover }
.av { width: 44px; height: 44px; border-radius: 22px; background: var(--soft); display: grid; place-items: center; font: 600 16px "DM Sans"; flex: none }
.rm { flex: 1; min-width: 0 }
.rn { font: 600 17px/1.25 "DM Sans"; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rs { font: 400 15px/1.3 "DM Sans"; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ra { text-align: right; flex: none }
.ra b { display: block; font: 700 17px "DM Sans"; font-variant-numeric: tabular-nums }
.tag { display: inline-block; font: 600 14px/1 "DM Sans"; padding: 5px 8px; border-radius: 6px; margin-top: 5px }
.t-todo { background: #FFF1C2; color: #682D03 }
.t-ok { background: #CFF7D3; color: #02542D }
.t-bad { background: #FDD3D0; color: #900B09 }
.t-neu { background: #F5F5F5; color: #303030 }
/* recherche */
.search { margin: 14px 20px 0; height: 52px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 400 17px "DM Sans"; color: var(--faint) }
/* contacts récents façon Wave */
.recent { display: flex; gap: 14px; padding: 18px 20px 4px; overflow: hidden }
.rc { width: 70px; flex: none; display: grid; justify-items: center; gap: 7px; font: 500 14px/1.2 "DM Sans"; text-align: center }
.rc .av { width: 60px; height: 60px; border-radius: 30px; font-size: 19px }
.lbl { font: 600 14px "DM Sans"; color: var(--muted); padding: 22px 20px 4px; text-transform: uppercase; letter-spacing: .05em }
/* montant + clavier */
.who { display: flex; align-items: center; gap: 12px; margin: 16px 20px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px }
.who b { font: 600 17px "DM Sans"; display: block }
.who span { font: 400 15px "DM Sans"; color: var(--muted) }
.amt { text-align: center; padding: 34px 20px 0 }
.amt .big { font: 700 56px/1 "DM Sans"; letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.amt .cur { display: inline-flex; margin-top: 18px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.amt .cur span { padding: 8px 18px; font: 600 16px "DM Sans" }
.amt .cur .on { background: var(--ink); color: #F5F5F5 }
.amt .conv { font: 500 17px "DM Sans"; color: var(--body); margin-top: 16px }
.amt .rate { font: 400 15px "DM Sans"; color: var(--muted); margin-top: 6px }
.keys { position: absolute; left: 0; right: 0; bottom: 110px; display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 6px; padding: 0 24px }
.keys div { height: 58px; display: grid; place-items: center; font: 500 28px "DM Sans" }
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 36px; background: #fff; border-top: 1px solid var(--line) }
.btn { height: 56px; border-radius: 8px; background: var(--ink); color: #F5F5F5; display: grid; place-items: center; font: 600 18px "DM Sans" }
.btn.off { background: #D9D9D9; color: #B3B3B3 }
.btn.soft { background: #fff; color: var(--strong); border: 1px solid var(--line) }
/* fiche */
.fiche { text-align: center; padding: 22px 20px 0 }
.fiche .logo { width: 56px; height: 56px; border-radius: 28px; margin: 0 auto }
.fiche .logo svg { width: 30px; height: 30px }
.fiche .big { font: 700 48px/1 "DM Sans"; letter-spacing: -.03em; margin-top: 14px; font-variant-numeric: tabular-nums }
.fiche .sub { font: 400 16px "DM Sans"; color: var(--muted); margin-top: 8px }
.fiche .tag { font-size: 15px; padding: 6px 10px; margin-top: 12px }
.box { margin: 18px 20px 0; border: 1px solid var(--line); border-radius: 8px }
.kv { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font: 400 16px "DM Sans"; color: var(--muted) }
.kv:last-child { border-bottom: 0 }
.kv b { font: 600 16px "DM Sans"; color: var(--strong); text-align: right }
.benef { display: flex; gap: 14px; align-items: center; padding: 14px 16px }
.qr { width: 92px; height: 92px; display: grid; grid-template-columns: repeat(21, 1fr); flex: none; padding: 6px; border: 1px solid var(--line); border-radius: 8px }
.qr i { background: transparent } .qr i.k { background: #111 }
.copy { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; height: 36px; padding: 0 12px; border: 1px solid #767676; border-radius: 8px; background: #E3E3E3; font: 600 15px "DM Sans"; color: var(--body) }
/* segmented / filtres */
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg span { text-align: center; padding: 11px 0; font: 600 16px "DM Sans" }
.seg .on { background: var(--ink); color: #F5F5F5 }
.chips { display: flex; gap: 8px; padding: 14px 20px 0 }
.chip { height: 36px; padding: 0 12px; border-radius: 8px; background: var(--soft); display: flex; align-items: center; gap: 6px; font: 600 15px "DM Sans"; color: var(--body); white-space: nowrap }
.chip.on { background: var(--ink); color: #F5F5F5 }
.day { font: 600 15px "DM Sans"; color: var(--muted); padding: 18px 20px 0 }
/* dépôt */
.methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 20px }
.m { border: 1px solid var(--line); border-radius: 8px; height: 88px; display: grid; justify-items: center; align-content: center; gap: 8px; font: 600 14px "DM Sans"; text-align: center }
.m.on { border: 2px solid var(--ink) }
.m .logo { width: 36px; height: 36px; border-radius: 18px }
.proof { margin: 0 20px; height: 120px; border: 1.5px dashed var(--field); border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 8px; font: 600 16px "DM Sans" }
.field { margin: 0 20px; height: 64px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; padding: 0 16px; font: 700 30px "DM Sans"; letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.field small { font: 600 18px "DM Sans"; color: var(--muted); margin-left: 8px }
.note { margin: 10px 20px 0; font: 500 16px "DM Sans"; color: var(--body) }
.mola { position: absolute; left: 18px; bottom: 104px; width: 58px; height: 58px; border-radius: 29px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line) }
.mola img { width: 100%; height: 100% }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 10px 20px 36px; border-top: 1px solid var(--line); z-index: 5 }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 4 }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px }
.sheet h3 { font: 600 22px "DM Sans" }
.sheet p { font: 400 16px "DM Sans"; color: var(--muted); margin-top: 4px }
.done { width: 72px; height: 72px; border-radius: 36px; background: #CFF7D3; display: grid; place-items: center; margin: 0 auto }
</style></head><body>
<div class="board" id="board"></div>
