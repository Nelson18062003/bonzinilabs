<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Trésorerie complète</title>
<link rel="stylesheet" href="../kit2.css">
<style>
/* Lot 07 · Trésorerie complète — mêmes jetons que kit2.css, styles repris du lot 05 */
.bk { border: 1px solid var(--line); background: #fff }
.bk img { object-fit: contain; padding: 6px }
.seg3 { grid-template-columns: repeat(3, 1fr) }
.seg4 { grid-template-columns: repeat(4, 1fr) }
.seg4 span { padding: 8px 0; line-height: 1.2; font-size: 15px }
.seg4 span em { display: block; font: 500 14px "DM Sans"; font-style: normal; color: var(--muted) }
.seg4 .on em { color: #D9D9D9 }
.seg span + span { border-left: 1px solid var(--line) }
.seg .on + span, .seg span.on { border-left: 0 }
.split { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px }
.split div { display: flex; justify-content: space-between; font: 500 16px "DM Sans"; color: var(--muted); font-variant-numeric: tabular-nums }
.split b { font-weight: 600; color: var(--strong) }
.acts .act { font-size: 15px; align-content: start }
.mrow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.mrow:last-child { border-bottom: 0 }
.mrow .av svg { width: 22px; height: 22px }
.mrow .rn { font-size: 17px }
.red .rn { color: #EC221F }
.red .av { background: #FDD3D0 }
.link { font: 600 16px "DM Sans"; color: var(--strong); text-decoration: underline; text-underline-offset: 3px }
.twin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.twin .btn { font-size: 17px; display: flex; gap: 8px; justify-content: center; align-items: center }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.stat span { font: 500 15px "DM Sans"; color: var(--muted); display: block }
.stat b { font: 700 22px "DM Sans"; display: block; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px }
.inbox { width: 140px; height: 48px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; font: 700 18px "DM Sans"; font-variant-numeric: tabular-nums; flex: none }
.inbox.on { border: 2px solid var(--ink) }
.arrow { color: var(--muted); font-weight: 500; margin: 0 4px }
.chart { margin: 14px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 14px 12px 10px }
.chart svg { display: block }
.chart svg text { font: 500 14px "DM Sans"; fill: #5A5A5A }
.chart svg text.v { font: 700 14px "DM Sans"; fill: #1E1E1E }
.legend { display: flex; gap: 18px; padding: 10px 4px 2px; font: 500 15px "DM Sans"; color: var(--body) }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.legend i.sq { width: 12px; height: 12px; border-radius: 3px }
.rate-line { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; font: 600 17px "DM Sans"; font-variant-numeric: tabular-nums }
.rate-line .tag { margin-top: 0 }
.recv { margin: 16px 20px 0; height: 56px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 500 16px "DM Sans"; color: var(--muted) }
.recv b { font: 700 22px "DM Sans"; color: var(--strong); font-variant-numeric: tabular-nums }
.recv b small { font: 600 16px "DM Sans"; color: var(--muted); margin-left: 4px }
.amt .lab0 { font: 500 16px "DM Sans"; color: var(--muted); margin-bottom: 8px }
.amt .big small { font-size: 26px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px }
.hint { text-align: center; margin-top: 8px; font: 400 15px "DM Sans"; color: var(--muted); font-variant-numeric: tabular-nums }
.rec { margin: 18px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 18px 0 0; text-align: center }
.rec .logo { width: 48px; height: 48px; margin: 0 auto }
.rec .logo svg { width: 26px; height: 26px }
.rec .big { font: 700 40px/1 "DM Sans"; letter-spacing: -.02em; margin-top: 12px; font-variant-numeric: tabular-nums }
.rec .sub { font: 400 16px "DM Sans"; color: var(--muted); margin-top: 6px }
.rec .box { margin: 14px 0 0; border: 0; border-top: 1px solid var(--line); border-radius: 0 }
.rec .kv { padding: 12px 16px }
.rec .tag { font-size: 15px; padding: 6px 10px; margin-top: 10px }
.strike { text-decoration: line-through; text-decoration-thickness: 3px; color: var(--muted) }
/* nouveaux du lot */
.ra .rs { margin-top: 3px }
.ra .tag { margin-top: 4px }
.pick { margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 10px 14px }
.pick .logo { width: 36px; height: 36px }
.pick .logo svg { width: 20px; height: 20px }
.pick span { display: block; font: 500 14px "DM Sans"; color: var(--muted) }
.pick b { display: block; font: 600 17px "DM Sans" }
.tot { display: grid; grid-template-columns: repeat(3, 1fr); margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px }
.tot div { padding: 10px 10px 10px 12px; min-width: 0 }
.tot div + div { border-left: 1px solid var(--line) }
.tot span { display: block; font: 500 14px "DM Sans"; color: var(--muted); white-space: nowrap }
.tot b { display: block; font: 700 16px "DM Sans"; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em }
.srch { margin: 12px 20px 0; height: 48px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 400 17px "DM Sans"; color: var(--faint) }
.chip svg { width: 18px; height: 18px }
.chip .n { background: #F5F5F5; color: var(--ink); border-radius: 9px; min-width: 20px; height: 20px; display: grid; place-items: center; font: 700 13px "DM Sans"; padding: 0 5px }
.chip.on .n { background: #F5F5F5 }
.chip.soft { background: #fff; border: 1px solid var(--line) }
.inp { margin: 0 20px; height: 56px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 500 17px "DM Sans"; color: var(--strong) }
.inp.ph { color: var(--faint) }
.inp.on { border: 2px solid var(--ink) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 20px }
.two .inp { margin: 0 }
.lbl.s { padding-top: 18px; padding-bottom: 8px }
.pre { font: 600 17px "DM Sans"; padding-right: 10px; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; height: 30px }
.mi { display: flex; align-items: center; gap: 14px; height: 52px; font: 600 17px "DM Sans"; color: var(--strong); border-bottom: 1px solid var(--line) }
.mi:last-child { border-bottom: 0 }
.mi .v { margin-left: auto; font: 500 16px "DM Sans"; color: var(--muted) }
.ta { min-height: 76px; border: 2px solid var(--ink); border-radius: 8px; padding: 12px 14px; font: 500 17px/1.35 "DM Sans"; color: var(--strong) }
.ta i { display: inline-block; width: 2px; height: 20px; background: var(--ink); vertical-align: -4px; margin-left: 1px }
.cnt { font: 500 14px "DM Sans"; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between }
.slab { font: 600 14px "DM Sans"; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 8px }
.btn.red { background: #EC221F; color: #fff }
.ban { margin: 14px 20px 0; border-radius: 8px; background: #FDD3D0; color: #900B09; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start }
.ban b { display: block; font: 700 16px "DM Sans" }
.ban span { display: block; font: 500 15px/1.35 "DM Sans"; margin-top: 2px }
.ban svg { flex: none; margin-top: 1px }
.alert { margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 12px 14px }
.alert .av { background: #FDD3D0 }
.kpi { padding: 16px 20px 0 }
.kpi .lab { font: 500 16px "DM Sans"; color: var(--muted) }
.kpi .num { font: 700 40px/1.1 "DM Sans"; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums }
.kpi .num small { font-size: 20px; font-weight: 600; color: var(--muted); letter-spacing: 0 }
.kpi .sub { font: 500 16px "DM Sans"; color: var(--body); margin-top: 8px; display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums }
.kpi .sub b { font-weight: 700 }
.kpi .sub .tag { margin-top: 0 }
.pager { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; gap: 8px; align-items: center }
.pager i { width: 8px; height: 8px; border-radius: 4px; background: #D9D9D9 }
.pager i.on { width: 22px; background: var(--ink) }
.hb { padding: 12px 0 14px; border-bottom: 1px solid var(--line) }
.hb:last-child { border-bottom: 0 }
.hb .t { display: flex; justify-content: space-between; align-items: center; font: 600 17px "DM Sans" }
.hb .t b { font: 700 17px "DM Sans"; font-variant-numeric: tabular-nums }
.hb .bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--ink); margin-top: 10px }
.hb .s { display: flex; justify-content: space-between; align-items: center; font: 400 15px "DM Sans"; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums }
.hb .s .tag { margin-top: 0 }
.card { margin: 18px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 4px 16px }
.card .hd { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 4px }
.card .hd b { font: 600 18px "DM Sans" }
.card .row { padding: 12px 0 }
/* image partageable des soldes */
.vis { margin: 14px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 18px 14px 16px }
.vis .h { text-align: center; font: 700 18px "DM Sans"; letter-spacing: .04em }
.vis .d { text-align: center; font: 500 14px "DM Sans"; color: var(--muted); margin-top: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--line) }
.vis .g { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px }
.vis .c { border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 10px }
.vis .c .top2 { display: flex; align-items: center; justify-content: space-between }
.vis .c .logo { width: 38px; height: 38px; border-radius: 19px }
.vis .c .logo.bk img { padding: 5px !important }
.vis .c .ty { font: 500 14px "DM Sans"; color: var(--muted) }
.vis .c .nm { font: 600 14px "DM Sans"; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.vis .c .am { font: 700 17px "DM Sans"; margin-top: 2px; font-variant-numeric: tabular-nums }
.vis .c .am small { font: 600 14px "DM Sans"; color: var(--muted) }
.vis .t { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 12px 0 }
.vis .t span { font: 600 14px "DM Sans"; color: var(--muted); letter-spacing: .06em }
.vis .t b { display: block; font: 700 28px "DM Sans"; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums }
.vis .t b small { font-size: 16px; color: var(--muted) }
</style></head><body>
<div class="board" id="board"></div>
<script src="../kit2.js"></script>
<script>
/* ---------- logos et icônes (repris du lot 05) ---------- */
const usdt = (s = 44) => `<div class="logo" style="background:#26A17B;width:${s}px;height:${s}px;border-radius:${s / 2}px"><svg viewBox="0 0 24 24" style="width:${s * .56}px;height:${s * .56}px"><path d="M5.5 5.2h13v2.9h-5v2.1c3 .2 5.3.9 5.3 1.8s-2.3 1.6-5.3 1.8v5.4h-3.1V13.8c-3-.2-5.3-.9-5.3-1.8s2.3-1.6 5.3-1.8V8.1h-4.9z" fill="#fff"/><path d="M6.6 12c0 .6 2.4 1.1 5.4 1.1s5.4-.5 5.4-1.1" fill="none" stroke="#26A17B" stroke-width="1"/></svg></div>`;
const binance = (s = 44) => `<div class="logo" style="background:#1E2329;width:${s}px;height:${s}px;border-radius:${s / 2}px"><svg viewBox="0 0 24 24" style="width:${s * .58}px;height:${s * .58}px"><g fill="#F3BA2F"><path d="M12 9.6 14.4 12 12 14.4 9.6 12z"/><path d="M7.9 10.3 9.6 12l-1.7 1.7L6.2 12zM16.1 10.3l1.7 1.7-1.7 1.7-1.7-1.7z"/><path d="M12 3.6l4.3 4.3-1.7 1.7L12 7 9.4 9.6 7.7 7.9z"/><path d="M12 20.4l-4.3-4.3 1.7-1.7L12 17l2.6-2.6 1.7 1.7z"/></g></svg></div>`;
const bank = (f, pad = 6, extra = '') => `<div class="logo bk"><img src="../${f}" style="object-fit:contain;padding:${pad}px;${extra}"></div>`;
const afriland = bank('afriland.png', 9);
const ecobank = bank('ecobank.png', 4);
const uba = bank('uba.png', 6);
const cca = `<div class="logo" style="background:#6A2C8E"><img src="../cca.png" style="object-fit:cover;object-position:3% 50%"></div>`;
const caisseIc = '<svg width="24" height="24" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="#1E1E1E" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="#1E1E1E" stroke-width="2"/><path d="M6 9.5v5M18 9.5v5" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round"/></svg>';
const caisse = `<div class="av">${caisseIc}</div>`;
const svg = (d, c = '#1E1E1E', w = 2.1) => `<svg viewBox="0 0 24 24"><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ic = {
  buy: (c) => svg('M12 4v13M6 11l6 6 6-6M5 20h14', c),
  sell: (c) => svg('M12 20V7M6 13l6-6 6 6M5 4h14', c),
  wallet: (c) => svg('M4 7.5A2.5 2.5 0 0 1 6.5 5H19v14H6.5A2.5 2.5 0 0 1 4 16.5zM4 9h15M15.5 13.5h.5', c),
  list: (c) => svg('M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01', c, 2.3),
  adjust: (c) => svg('M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4', c),
  inv: (c) => svg('M8 4h8v3H8zM6 5.5H5v15h14v-15h-1M8.5 13l2.5 2.5 4.5-5', c),
  book: (c) => svg('M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3zM5 16.5a3 3 0 0 1 3-3h11M9 8.5h6', c),
  img: (c) => svg('M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 16l4.5-4.5 4 4 2.5-2.5L20 18M15.5 8.5h.01', c),
  people: (c) => svg('M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20c.8-3.4 3.3-5.3 6.5-5.3S15.2 16.6 16 20M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.8c1.7.7 2.7 2.5 3 5.2', c),
  plus: (c) => svg('M12 5v14M5 12h14', c, 2.3),
  chart: (c) => svg('M4 20h16M7 16.5v-4M12 16.5V7.5M17 16.5v-6', c, 2.3),
  copyimg: (c) => svg('M8 8h11v11H8zM5 15V5h10', c),
  down: (c) => svg('M12 4v11M7 10.5l5 5 5-5M5 20h14', c),
  share: (c) => svg('M12 15V4M7.5 8.5 12 4l4.5 4.5M6 12v7.5h12V12', c),
  undo: (c) => svg('M9 7 4.5 11.5 9 16M5 11.5h9a5.5 5.5 0 0 1 0 11H11', c),
  pen: (c) => svg('M5 19l1-4L16 5l3 3L9 18zM14 7l3 3', c),
  cal: (c) => svg('M4.5 6h15v14h-15zM4.5 10h15M9 4v4M15 4v4', c),
  hist: (c) => svg('M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4M12 8v4.5l3 2', c),
  sliders: (c) => svg('M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4', c),
  pdf: (c) => svg('M6 3.5h8l4 4v13H6zM14 3.5v4h4M9 13h6M9 16.5h4', c),
  alert: (c) => svg('M12 4 21 19.5H3zM12 10v4.5M12 17h.01', c),
  chevd: (c) => svg('m7 10 5 5 5-5', c, 2.3),
  x: (c) => svg('M6 6l12 12M18 6 6 18', c, 2.3),
};
const sz = (s, n = 20) => s.replace('<svg', `<svg width="${n}" height="${n}"`);
const chev = `<svg width="20" height="20" viewBox="0 0 24 24" style="flex:none"><path d="m9 6 6 6-6 6" fill="none" stroke="#5A5A5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const navb = (t, right = '') => `<div class="nav">${I.back}<div class="t">${t}</div>${right}</div>`;
const end = '<div class="home-ind"></div>';
const mrow = (icon, t, s = '', cls = '') => `<div class="mrow ${cls}"><div class="av">${icon}</div><div class="rm"><div class="rn">${t}</div>${s ? `<div class="rs">${s}</div>` : ''}</div></div>`;
const keys = `<div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', ''].map((k) => `<div>${k || I.del}</div>`).join('')}</div>`;
const av = (t) => `<div class="av">${t}</div>`;
const avI = (icon) => `<div class="av">${sz(icon, 22)}</div>`;
const plusNav = `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#1E1E1E" stroke-width="2.3" stroke-linecap="round"/></svg>`;
const chipCal = (t) => `<span class="chip">${sz(ic.cal('#303030'), 18)} ${t}</span>`;
const fr = (n, d = 0) => { const s = Math.abs(n).toFixed(d).split('.'); return (n < 0 ? '−' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (d ? ',' + s[1] : ''); };

/* ================= 1 · Accueil trésorier ================= */
const hello = (name) => `<div class="top"><div class="hello">Bonjour ${name}</div><div style="display:flex;gap:10px"><div class="icbtn" style="overflow:hidden;padding:0"><img src="../mola-mascot.png" style="width:100%;height:100%;border-radius:22px"></div><div class="icbtn">${I.bell}<span class="dot"></span></div></div></div>`;
const homeActs = `<div class="acts">
    <div class="act"><div class="r ink">${ic.buy('#F5F5F5')}</div>Acheter USDT</div>
    <div class="act"><div class="r">${ic.sell('#1E1E1E')}</div>Vendre USDT</div>
    <div class="act"><div class="r">${ic.inv('#1E1E1E')}</div>Inventaire</div>
    <div class="act"><div class="r">${ic.wallet('#1E1E1E')}</div>Comptes</div>
  </div>`;
add('Accueil trésorier', `${sbar()}<div class="body">${hello('Martine')}
  <div class="hero"><div class="lab">Stock USDT</div><div class="num">30 350,50 <small>USDT</small></div>
    <div class="sub"><span>Coût moyen <b>600,42</b> XAF/USDT</span></div>
    <div class="split"><div>Achetés aujourd'hui<b>+5 000,00</b></div><div>Vendus aujourd'hui<b>−3 000,00</b></div></div></div>
  ${homeActs}
  <div class="h2"><b>À faire</b></div>
  <div class="list">
    <div class="row">${meth('wechat')}<div class="rm"><div class="rn">Inventaire WeChat</div><div class="rs">Dernier il y a 3 jours</div></div><div class="ra"><span class="tag t-todo">À faire</span></div></div>
    <div class="row">${meth('alipay')}<div class="rm"><div class="rn">Écart Alipay</div><div class="rs">Hier · non expliqué</div></div><div class="ra"><b>−¥ 80</b><span class="tag t-bad">Écart</span></div></div>
  </div>
</div>${tabs('home', 'treasurer', {})}${end}`);

/* ================= 2 · Accueil · stock négatif ================= */
add('Accueil trésorier · stock négatif', `${sbar()}<div class="body">${hello('Martine')}
  <div class="hero"><div class="lab" style="display:flex;justify-content:space-between;align-items:center">Stock USDT<span class="tag t-bad" style="margin-top:0">Négatif</span></div><div class="num">−1 649,50 <small>USDT</small></div>
    <div class="sub"><span>Coût moyen <b>600,42</b> XAF/USDT</span></div></div>
  <div class="alert"><div class="av">${sz(ic.alert('#900B09'), 22)}</div><div class="rm"><div class="rn">Vente sans stock</div><div class="rs">32 000 USDT · Wang Jun · 11:30</div></div><span class="link">Voir</span></div>
  ${homeActs}
  <div class="h2"><b>À faire</b></div>
  <div class="list">
    <div class="row">${usdt()}<div class="rm"><div class="rn">Achat manquant</div><div class="rs">Au moins 1 649,50 USDT</div></div><div class="ra"><span class="tag t-bad">Urgent</span></div></div>
    <div class="row">${meth('wechat')}<div class="rm"><div class="rn">Inventaire WeChat</div><div class="rs">Dernier il y a 3 jours</div></div><div class="ra"><span class="tag t-todo">À faire</span></div></div>
  </div>
</div>${tabs('home', 'treasurer', {})}${end}`);

/* ================= 3 · Opérations ================= */

const W = 327;
const lineSvg = ({ series, lo, hi, ticks, tickFmt, xl, H = 170, endLabel }) => {
  const pr = 64, n = series[0].v.length, x = (i) => 4 + i * (W - pr - 8) / (n - 1), y = (v) => 10 + (hi - v) / (hi - lo) * (H - 20);
  const grid = ticks.map((t) => `<line x1="0" x2="${W - pr + 4}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#EDEDED"/><text x="${W - 2}" y="${(y(t) + 5).toFixed(1)}" text-anchor="end">${tickFmt(t)}</text>`).join('');
  const lines = series.map((s) => `<polyline points="${s.v.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1)}" cy="${y(s.v[n - 1])}" r="5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`).join('');
  const lab = endLabel ? endLabel(x, y) : '';
  return `<svg width="${W}" height="${H + 26}" viewBox="0 0 ${W} ${H + 26}">${grid}${lines}${lab}
    <text x="${x(0)}" y="${H + 22}">${xl[0]}</text><text x="${x(n - 1)}" y="${H + 22}" text-anchor="end">${xl[1]}</text></svg>`;
};
const barSvg = ({ v, labels, max, H = 170, grey = [], valueLabels = {} }) => {
  const n = v.length, bw = 26, gap = (W - n * bw) / n;
  return `<svg width="${W}" height="${H + 26}" viewBox="0 0 ${W} ${H + 26}">
    ${v.map((val, i) => { const h = val / max * (H - 26), xx = gap / 2 + i * (bw + gap); const lbl = valueLabels[i] ? `<text class="v" x="${xx + bw / 2}" y="${H - h - 8}" text-anchor="middle">${valueLabels[i]}</text>` : ''; return `<path d="M${xx} ${H}V${H - h + 4}q0-4 4-4h${bw - 8}q4 0 4 4V${H}z" fill="${grey.includes(i) ? '#B3B3B3' : '#2C2C2C'}"/>${lbl}`; }).join('')}
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#D9D9D9"/>
    ${labels.map(([i, l]) => `<text x="${gap / 2 + i * (bw + gap) + bw / 2}" y="${H + 21}" text-anchor="middle">${l}</text>`).join('')}</svg>`;
};
const pairSvg = ({ a, b, labels, max, ticks, H = 180 }) => {
  const n = a.length, pr = 0, grp = (W - 50) / n, bw = 30, y = (v) => H - v / max * (H - 16);
  const grid = ticks.map((t) => `<line x1="50" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#EDEDED"/><text x="0" y="${y(t) + 5}">${t ? fr(t / 1000) + ' k' : '0'}</text>`).join('');
  const bar = (xx, v, c) => { const h = H - y(v); return `<path d="M${xx} ${H}V${H - h + 4}q0-4 4-4h${bw - 8}q4 0 4 4V${H}z" fill="${c}"/>`; };
  return `<svg width="${W}" height="${H + 26}" viewBox="0 0 ${W} ${H + 26}">${grid}
    ${a.map((v, i) => { const x0 = 50 + i * grp + (grp - 2 * bw - 2) / 2; return bar(x0, v, '#2C2C2C') + bar(x0 + bw + 2, b[i], '#B3B3B3'); }).join('')}
    <line x1="50" x2="${W}" y1="${H}" y2="${H}" stroke="#D9D9D9"/>
    ${labels.map((l, i) => `<text x="${50 + i * grp + grp / 2}" y="${H + 21}" text-anchor="middle">${l}</text>`).join('')}</svg>`;
};
