<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Trésorerie et taux</title>
<link rel="stylesheet" href="../kit2.css">
<style>
/* Lot 05 · Trésorerie, Taux, Analyses — mêmes jetons que kit2.css */
.bk { border: 1px solid var(--line); background: #fff }
.bk img { object-fit: contain; padding: 6px }
.seg3 { grid-template-columns: repeat(3, 1fr) }
.split { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px }
.split div { display: flex; justify-content: space-between; font: 500 16px "DM Sans"; color: var(--muted); font-variant-numeric: tabular-nums }
.split b { font-weight: 600; color: var(--strong) }
.acts .act { font-size: 15px; align-content: start }
.sub2 { font: 400 15px "DM Sans"; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums }
.mrow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.mrow:last-child { border-bottom: 0 }
.mrow .av svg { width: 22px; height: 22px }
.mrow .rn { font-size: 17px }
.red .rn { color: #EC221F }
.red .av { background: #FDD3D0 }
.link { font: 600 16px "DM Sans"; color: var(--strong); text-decoration: underline; text-underline-offset: 3px }
.twin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.twin .btn { font-size: 17px; display: flex; gap: 8px; justify-content: center; align-items: center }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.stat span { font: 500 15px "DM Sans"; color: var(--muted); display: block }
.stat b { font: 700 22px "DM Sans"; display: block; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px }
.inbox { width: 112px; height: 48px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; font: 700 20px "DM Sans"; font-variant-numeric: tabular-nums }
.inbox.on { border: 2px solid var(--ink) }
.arrow { color: var(--muted); font-weight: 500; margin: 0 4px }
.chart { margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 14px 12px 10px }
.chart svg text { font: 500 14px "DM Sans"; fill: #5A5A5A }
.legend { display: flex; gap: 18px; padding: 10px 6px 2px; font: 500 15px "DM Sans"; color: var(--body) }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.quote { margin: 16px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 20px 18px }
.quote .brand { display: flex; justify-content: space-between; align-items: center; font: 700 18px "DM Sans"; letter-spacing: -.01em }
.quote .brand span { font: 500 15px "DM Sans"; color: var(--muted); letter-spacing: 0 }
.quote .ql { font: 500 15px "DM Sans"; color: var(--muted); margin-top: 18px }
.quote .qv { font: 700 34px/1.1 "DM Sans"; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums }
.quote .qm { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font: 500 15px "DM Sans"; color: var(--body) }
.quote .qm .logo { width: 32px; height: 32px }
.quote .qm .logo svg { width: 18px; height: 18px }
.rate-line { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; font: 600 17px "DM Sans"; font-variant-numeric: tabular-nums }
.rate-line .tag { margin-top: 0 }
.recv { margin: 18px 20px 0; height: 56px; border: 1px solid var(--field); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 500 16px "DM Sans"; color: var(--muted) }
.recv b { font: 700 22px "DM Sans"; color: var(--strong); font-variant-numeric: tabular-nums }
.recv b small { font: 600 16px "DM Sans"; color: var(--muted); margin-left: 4px }
.amt .lab0 { font: 500 16px "DM Sans"; color: var(--muted); margin-bottom: 8px }
.amt .big small { font-size: 26px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px }
.methods.sm .m { height: 76px; gap: 6px }
.methods.sm .m .logo { width: 32px; height: 32px }
.methods.sm .m .logo svg { width: 18px; height: 18px }
.sugg { margin: 18px 20px 0; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 12px 14px }
.rec { margin: 20px 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 18px 0 0; text-align: center }
.rec .logo { width: 48px; height: 48px; margin: 0 auto }
.rec .logo svg { width: 26px; height: 26px }
.rec .big { font: 700 40px/1 "DM Sans"; letter-spacing: -.02em; margin-top: 12px; font-variant-numeric: tabular-nums }
.rec .sub { font: 400 16px "DM Sans"; color: var(--muted); margin-top: 6px }
.rec .box { margin: 14px 0 0; border: 0; border-top: 1px solid var(--line); border-radius: 0 }
.rec .kv { padding: 12px 16px }
</style></head><body>

const lineChart = () => {

  return `<svg width="${W}" height="${H + 24}" viewBox="0 0 ${W} ${H + 24}">${grid}
    <polyline points="${pts(series.c)}" fill="none" stroke="#9E9E9E" stroke-width="2.5" stroke-linejoin="round"/>
