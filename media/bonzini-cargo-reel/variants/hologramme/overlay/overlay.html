<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// HOLOGRAMME overlay. Deterministic: every pixel is a function of the frame number n (t = n / 30).
const W = 1080, H = 1920, FPS = 30;
const HOLO = '#62F1FF', ICE = '#E2FDFF', AMBER = '#F3A745', VIOLET = '#A947FE', ORANGE = '#FE560D';
const hc = a => `rgba(98,241,255,${a})`, ic = a => `rgba(226,253,255,${a})`, ac = a => `rgba(243,167,69,${a})`, nv = a => `rgba(2,10,24,${a})`;
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
let CAPS = null, CONFIG = {}, LOGO = [];

// ------------------------------------------------------------------ math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const frac = x => x - Math.floor(x);
function rnd(i) { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function env(t, a, b, fin = .25, fout = .25) {
  if (t < a || t > b) return 0;
  return Math.min(fin > 0 ? eOutCubic(clamp((t - a) / fin)) : 1, fout > 0 ? clamp((b - t) / fout) : 1);
}
// hologram flicker: mostly ~1, with rare short dips (deterministic per frame)
function flick(n, seed, depth = .35) {
  const r = rnd(n * 1.37 + seed * 17.1);
  return r < .06 ? 1 - depth * (0.4 + 0.6 * rnd(n + seed)) : 1 - .06 * rnd(n * 3.1 + seed);
}
const typed = (s, p) => s.slice(0, Math.floor(clamp(p) * s.length + 1e-6));
// shared with the compositor: the "rebuild" beam of the 16.00 transition
function beamY(t) {
  if (t >= 15.55 && t < 16.0) return H * eInOutCubic(prog(t, 15.55, 16.0));
  if (t >= 16.0 && t < 16.45) return H * eOutCubic(prog(t, 16.0, 16.45));
  return null;
}

// ------------------------------------------------------------------ drawing helpers
function txt(s, x, y, o = {}) {
  if (!s) return;
  ctx.save();
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.font = o.font || '600 26px Raj';
  ctx.letterSpacing = (o.ls ?? 0) + 'px';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,6,16,.8)'; ctx.shadowBlur = o.shadowBlur ?? 10; ctx.shadowOffsetY = 2; }
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.strokeColor || nv(.8); ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur ?? 16; ctx.shadowOffsetY = 0; }
  ctx.fillStyle = o.color || ICE;
  ctx.fillText(s, x, y);
  if (o.glow && o.glowTwice) ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, font, ls = 0) { ctx.save(); ctx.font = font; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function seg(x0, y0, x1, y1, color = HOLO, w = 1.5, alpha = 1, blur = 8) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'butt';
  if (blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
function dotted(x0, y0, x1, y1, color = HOLO, w = 2, dash = [2, 7], alpha = 1, off = 0) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.lineDashOffset = off; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
function ellipse(x, y, rx, ry, color, w, alpha, dash = null, off = 0, blur = 0, a0 = 0, a1 = Math.PI * 2) {
  if (alpha <= 0 || rx <= 0 || ry <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w;
  if (dash) { ctx.setLineDash(dash); ctx.lineDashOffset = off; }
  if (blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, a0, a1); ctx.stroke(); ctx.restore();
}
const ring = (x, y, r, color, w, alpha, dash = null, off = 0, blur = 10) => ellipse(x, y, r, r, color, w, alpha, dash, off, blur);
function hexPath(cx, cy, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = rot + Math.PI / 6 + i * Math.PI / 3; const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath();
}
function hexGrid(x0, y0, w, h, r, t, seed, baseA, color = HOLO) {
  const dx = Math.sqrt(3) * r, dy = 1.5 * r;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1;
  let k = 0;
  for (let row = 0; row * dy < h + r; row++) for (let col = 0; col * dx < w + dx; col++, k++) {
    const cx = x0 + col * dx + (row % 2) * dx / 2, cy = y0 + row * dy;
    const wave = .5 + .5 * Math.sin(t * 1.8 - cx * .018 + cy * .012 + seed);
    const tw = rnd(seed * 31 + k * 7.3 + Math.floor(t * 5)) > .965 ? 2.6 : 1;
    const a = baseA * (.3 + .7 * wave) * tw;

    ctx.globalAlpha = Math.min(1, a); hexPath(cx, cy, r * .92); ctx.stroke();
  }
  ctx.restore();
}
function cornerMarks(x0, y0, x1, y1, arm, alpha, color = HOLO) {
  if (alpha <= 0) return;
  for (const [x, y, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x1, y1, -1, -1], [x0, y1, 1, -1]]) {
    seg(x, y, x + sx * arm * .4, y, color, 2, alpha, 6); seg(x, y, x, y + sy * arm * .4, color, 2, alpha, 6);
    dotted(x + sx * arm * .45, y, x + sx * arm, y, color, 2, [2, 5], alpha * .8);
    dotted(x, y + sy * arm * .45, x, y + sy * arm, color, 2, [2, 5], alpha * .8);
    ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.fillRect(x - 2.5, y - 2.5, 5, 5); ctx.restore();
  }
}
// soft dark "projection field" behind a module (no hard panel: blurred, edge-less)
function field(x, y, w, h, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.filter = 'blur(26px)';
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, nv(.8)); g.addColorStop(.7, nv(.66)); g.addColorStop(1, nv(.25));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
}
function checkPath(x, y, s, p, color = AMBER, lw = null) {
  if (p <= 0) return;
  const pts = [[-0.45, 0.02], [-0.12, 0.34], [0.5, -0.36]];
  const L1 = Math.hypot(0.33, 0.32), L2 = Math.hypot(0.62, 0.70), tot = L1 + L2, d = p * tot;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw ?? s * 0.14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  if (d <= L1) { const k = d / L1; ctx.lineTo(x + lerp(pts[0][0], pts[1][0], k) * s, y + lerp(pts[0][1], pts[1][1], k) * s); }
  else { ctx.lineTo(x + pts[1][0] * s, y + pts[1][1] * s); const k = (d - L1) / L2; ctx.lineTo(x + lerp(pts[1][0], pts[2][0], k) * s, y + lerp(pts[1][1], pts[2][1], k) * s); }
  ctx.stroke(); ctx.restore();
}
// line-art text: outline strokes "draw" (dash grows along every glyph contour), then a scan-wipe fill
function lineText(s, x, y, o) {
  const font = o.font, ls = o.ls || 0, align = o.align || 'center';
  if (o.pStroke > 0) {
    ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1) * (o.strokeAlpha ?? 1);
    ctx.font = font; ctx.letterSpacing = ls + 'px'; ctx.textAlign = align;
    const L = o.dashL || 520;
    if (o.pStroke < 1) ctx.setLineDash([L * o.pStroke, L * 3]);
    ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.strokeColor || HOLO; ctx.lineJoin = 'round';
    ctx.shadowColor = HOLO; ctx.shadowBlur = 14; ctx.strokeText(s, x, y);
    ctx.shadowBlur = 0; ctx.strokeText(s, x, y);
    ctx.restore();
  }
  if (o.pFill > 0) {
    const fs = o.fs, top = y - fs * .82, hgt = fs * 1.0;
    const yw = top + hgt * clamp(o.pFill);
    ctx.save(); ctx.beginPath(); ctx.rect(0, top - 10, W, yw - top + 10); ctx.clip();
    txt(s, x, y, { font, ls, align, color: o.fill || ICE, glow: o.glow || hc(.85), glowBlur: o.glowBlur ?? 26, glowTwice: o.glowTwice, alpha: o.alpha ?? 1, shadow: false });
    ctx.restore();
    if (o.pFill < 1) { // scan edge
      const w2 = o.wipeW || 460;
      ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
      const lg = ctx.createLinearGradient(x - w2, 0, x + w2, 0); lg.addColorStop(0, hc(0)); lg.addColorStop(.5, 'rgba(255,255,255,.95)'); lg.addColorStop(1, hc(0));
      ctx.fillStyle = lg; ctx.shadowColor = HOLO; ctx.shadowBlur = 18; ctx.fillRect(x - w2 + (align === 'left' ? w2 : 0), yw - 1.5, w2 * 2, 3); ctx.restore();
    }
  }
}
// scrolling column of hex data (decorative texture)
function dataColumn(x, y0, y1, t, speed, seed, alpha, o = {}) {
  if (alpha <= 0) return;
  const lh = o.lh || 22, cols = o.cols || 2, off = frac(t * speed / lh) * lh, base = Math.floor(t * speed / lh);
  ctx.save(); ctx.font = o.font || '500 16px Mono'; ctx.textAlign = o.align || 'left';
  for (let i = -1; y0 + i * lh < y1 + lh; i++) {
    const row = base + i, y = y0 + i * lh - off + lh;
    if (y < y0 || y > y1) continue;
    const edge = Math.min(clamp((y - y0) / 60), clamp((y1 - y) / 60));
    let s = '';
    for (let c = 0; c < cols; c++) s += (c ? ' ' : '') + Math.floor(rnd(seed * 131 + row * 7.7 + c) * 256).toString(16).toUpperCase().padStart(2, '0');
    const hot = rnd(seed * 3 + row * 1.3) > .9;
    ctx.globalAlpha = alpha * edge * (hot ? 1 : .55);
    ctx.fillStyle = hot ? ICE : HOLO;
    ctx.fillText(s, x, y);
  }
  ctx.restore();
}
// dotted radial scanner (rings, rotating ticks, sweep)
function radar(x, y, r, t, alpha, color = HOLO) {
  if (alpha <= 0) return;
  ring(x, y, r, color, 2, alpha * .7, [2, 7], t * 30, 6);
  ring(x, y, r * .62, color, 1.5, alpha * .45, [1, 5], -t * 20, 0);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(t * 1.6);
  const sg = ctx.createLinearGradient(0, 0, r, 0); sg.addColorStop(0, hc(0)); sg.addColorStop(1, hc(.35));
  ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, -.55, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.translate(x, y); ctx.rotate(-t * .5);
  for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12, l = i % 6 === 0 ? 14 : 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * (r + 6), Math.sin(a) * (r + 6)); ctx.lineTo(Math.cos(a) * (r + 6 + l), Math.sin(a) * (r + 6 + l)); ctx.stroke(); }
  ctx.restore();
}
function hexShield(x, y, s, color, alpha, lw = 2.5) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.shadowColor = color; ctx.shadowBlur = 12;
  hexPath(x, y, s, 0); ctx.stroke(); ctx.globalAlpha *= .5; hexPath(x, y, s * .72, 0); ctx.stroke(); ctx.restore();
}

// ------------------------------------------------------------------ 3D wireframe container
const CL = 12.2, CH = 2.6, CW = 2.44;
let CONT = [];
function buildContainer() {
  const s = [], x0 = -CL / 2, x1 = CL / 2, y0 = -CH / 2, y1 = CH / 2, z0 = -CW / 2, z1 = CW / 2;
  for (const y of [y0, y1]) for (const z of [z0, z1]) s.push([[x0, y, z], [x1, y, z], 0, 1]);
  for (const x of [x0, x1]) for (const z of [z0, z1]) s.push([[x, y0, z], [x, y1, z], 0, 1]);
  for (const x of [x0, x1]) for (const y of [y0, y1]) s.push([[x, y, z0], [x, y, z1], 0, 1]);
  const N = 30;
  for (const z of [z0, z1]) for (let i = 1; i < N; i++) { const x = x0 + i * CL / N; s.push([[x, y0 + .12, z], [x, y1 - .14, z], 1, i % 2 ? .38 : .6]); }
  for (const z of [z0, z1]) { s.push([[x0, y1 - .14, z], [x1, y1 - .14, z], 2, .55]); s.push([[x0, y0 + .12, z], [x1, y0 + .12, z], 2, .55]); }
  for (let i = 1; i < N; i += 2) { const x = x0 + i * CL / N; s.push([[x, y1, z0 + .08], [x, y1, z1 - .08], 3, .22]); }
  s.push([[x1, y0, 0], [x1, y1, 0], 4, .95]);
  for (const zz of [-.72, -.36, .36, .72]) s.push([[x1, y0 + .12, zz * CW / 2], [x1, y1 - .12, zz * CW / 2], 4, .6]);
  for (const yy of [-.75, -.25, .25, .75]) for (const zz of [-.72, -.36, .36, .72]) s.push([[x1, yy * CH / 2, zz * CW / 2 - .09], [x1, yy * CH / 2, zz * CW / 2 + .09], 4, .7]);
  for (let i = 1; i < 6; i++) { const z = z0 + i * CW / 6; s.push([[x0, y0 + .1, z], [x0, y1 - .1, z], 4, .4]); }

}
function proj(p, c) {
  const cyw = Math.cos(c.yaw), syw = Math.sin(c.yaw);
  const x = p[0] * cyw - p[2] * syw, z = p[0] * syw + p[2] * cyw, y = p[1];
  const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);

function drawContainer(cam, pBuild, yScan, color, alphaAll, lw = 1.6) {
  const R = 6.4, segsP = [];
  for (const [a, b, g, ab] of CONT) {
    let A = a, B = b;
    const pe = g === 0 ? pBuild : 1;
    if (pe <= 0) continue;
    if (g !== 0) {
      if (Math.min(a[1], b[1]) > yScan) continue;
      if (Math.max(a[1], b[1]) > yScan) { const k = (yScan - a[1]) / (b[1] - a[1]); const P = [lerp(a[0], b[0], k), yScan, lerp(a[2], b[2], k)]; if (a[1] > b[1]) A = P; else B = P; }

    const pa = proj(A, cam), pb = proj(B, cam);

  const crisp = color === HOLO ? '#D2FDFF' : color;
  for (const pass of [0, 1]) {   // glow pass then crisp pass
    ctx.strokeStyle = pass ? crisp : color;
    ctx.lineWidth = pass ? lw : lw * 4;
    for (const [x0, y0, x1, y1, a] of segsP) { ctx.globalAlpha = pass ? a : a * .16; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
  }

  ctx.fillStyle = color;
  for (const x of [-CL / 2, CL / 2]) for (const y of [-CH / 2, CH / 2]) for (const z of [-CW / 2, CW / 2]) {
    const p = proj([x, y, z], cam); ctx.globalAlpha = alphaAll * pBuild * lerp(1, .35, clamp((p[2] + 6.4) / 12.8)); ctx.fillRect(p[0] - 3, p[1] - 3, 6, 6);

}
function projCircle(cam, y, r, npts = 72) {
  const pts = [];
  for (let i = 0; i <= npts; i++) { const a = i / npts * Math.PI * 2; pts.push(proj([Math.cos(a) * r, y, Math.sin(a) * r], { ...cam, yaw: 0 })); }

function polyline(pts, color, w, alpha, dash = null, off = 0) {

// vertical "power off" collapse of a region into a bright line (used for module/title exits)
function collapse(fn, k, cy, x0 = 0, x1 = W) {

  if (k >= 1) return;
  const s = Math.max(.02, 1 - eInCubic(k));
  ctx.save(); ctx.translate(0, cy); ctx.scale(1 + .08 * k, s); ctx.translate(0, -cy); fn(); ctx.restore();

// ------------------------------------------------------------------ timeline data
const TRACK = [ // container body box on screen (from v1), used for the subject reticle
  [3.6, 50, 540, 1030, 1130], [4.2, 110, 590, 970, 1100], [5.0, 110, 590, 970, 1100], [6.0, 100, 590, 980, 1100],
  [6.8, 80, 580, 1000, 1110], [7.5, 70, 580, 1000, 1110], [8.0, 80, 580, 1000, 1110], [8.5, 170, 590, 1000, 1110],
  [9.0, 270, 600, 1000, 1110], [9.4, 420, 600, 1000, 1110]];
function trackAt(t) {
  if (t <= TRACK[0][0]) return TRACK[0].slice(1);
  for (let i = 0; i < TRACK.length - 1; i++) {
    const a = TRACK[i], b = TRACK[i + 1];
    if (t <= b[0]) { const k = eInOutCubic((t - a[0]) / (b[0] - a[0])); return [1, 2, 3, 4].map(j => lerp(a[j], b[j], k)); }
  }

}
const SCANBOX = [ // warehouse goods (cartons along the back wall): [tIn, tOut, box at tIn, box at tOut, label]
  [22.25, 23.15, [640, 425, 870, 610], [790, 425, 995, 610], 'COLIS · OK'],
  [23.55, 24.60, [40, 425, 430, 610], [70, 425, 600, 610], 'COLIS · OK']];

// ------------------------------------------------------------------ layers
function bootLayer(t, n) {
  if (t > .95) return;
  // alignment cross: projector calibrating
  const a = env(t, 0, .95, .05, .3), ca = env(t, 0, .6, .04, .25);
  const k = eOutExpo(prog(t, .02, .5));
  seg(540 - 540 * k, 960, 540 + 540 * k, 960, HOLO, 1.5, ca * .6, 12);
  seg(540, 960 - 960 * k, 540, 960 + 960 * k, HOLO, 1.5, ca * .35, 12);
  ring(540, 960, 30 + 260 * k, HOLO, 1.5, a * (1 - k) * .8, [3, 9], t * 200);
  // scan line matching the slice assembly in the compositor
  const y = H * eInOutCubic(prog(t, .02, .62));
  if (t < .66) {
    ctx.save(); ctx.globalAlpha = 1 - prog(t, .56, .66);
